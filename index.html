<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diario de Viaje Hiperrealista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Así font-serif y font-hand de Tailwind ya apuntan a las fuentes del diario
        tailwind.config = {
            theme: { extend: { fontFamily: {
                serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                hand: ['Caveat', 'Segoe Script', 'cursive']
            } } }
        };
    </script>
    <style>
        /* Fuentes vendorizadas en assets/fonts (SIL OFL 1.1): sin ellas la app
           dependería de la red para tener su propia letra. */
        @font-face {
            font-family: 'Caveat';
            src: url('assets/fonts/caveat-latin.woff2') format('woff2');
            font-weight: 400 700; font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Caveat';
            src: url('assets/fonts/caveat-latin-ext.woff2') format('woff2');
            font-weight: 400 700; font-display: swap;
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('assets/fonts/cormorant-latin.woff2') format('woff2');
            font-weight: 400 700; font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('assets/fonts/cormorant-latin-ext.woff2') format('woff2');
            font-weight: 400 700; font-display: swap;
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        :root {
            --font-hand: 'Caveat', 'Segoe Script', cursive;
            --font-serif: 'Cormorant Garamond', 'Georgia', serif;

            --desk-bg: #241a13;
            --paper-color: #f6efdb;
            --paper-lines: #dbcfb2;
            --ink: #2b3040;
            --ink-soft: #5d6274;
            --gold: #f0dfb4;

            /* Grano reutilizable: ruido en escala de grises, sin imágenes externas */
            --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23g)' opacity='0.55'/></svg>");
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--desk-bg);
            overflow: hidden;
            font-family: var(--font-serif);
            -webkit-tap-highlight-color: transparent;
        }

        /* Utilidades para ocultar barras de desplazamiento pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fondo de madera: vetas finas, vetas anchas, viñeteado y color base */
        .bg-wood {
            background-color: #3a2519;
            background-image:
                repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 9px),
                repeating-linear-gradient(90deg, rgba(255,235,205,0.028) 0 1px, transparent 1px 27px),
                linear-gradient(180deg, rgba(0,0,0,0.5), transparent 16%, transparent 84%, rgba(0,0,0,0.55)),
                radial-gradient(130% 55% at 50% -5%, rgba(255,206,150,0.12), transparent 65%),
                linear-gradient(90deg, #2b1a11, #4a3020 32%, #3d2718 68%, #281810);
            background-attachment: local;
        }

        /* Las baldas se dibujan al fondo de cada fila: el periodo del degradado
           coincide con la altura del hueco, así siempre quedan bajo los libros. */
        .shelf-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            column-gap: 22px;
            row-gap: 0;
            padding: 30px 18px 70px;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0, transparent 252px,
                rgba(0,0,0,0.6) 252px, rgba(0,0,0,0.6) 254px,
                #7a5231 254px, #573822 259px, #34200f 266px,
                rgba(0,0,0,0.75) 266px, rgba(0,0,0,0.75) 268px,
                transparent 268px);
            background-origin: content-box;
            background-clip: content-box;
        }

        .book-slot {
            height: 268px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 16px;
        }

        /* El ancho y el alto los pone JS, distintos por diario, para que la
           estantería no parezca una fila de clones. */
        .book-spine {
            border-radius: 3px 9px 9px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow:
                inset 7px 0 16px rgba(0,0,0,0.6),
                inset -3px 0 8px rgba(255,255,255,0.16),
                inset 0 0 0 1px rgba(0,0,0,0.3),
                7px 12px 18px rgba(0,0,0,0.62);
        }

        /* Grano de tela/piel */
        .book-spine::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: var(--grain);
            opacity: 0.3;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Nervios: los resaltes que deja la encuadernación arriba y abajo */
        .book-spine::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background-image:
                linear-gradient(180deg, transparent 15px, rgba(255,255,255,0.16) 15px 18px, rgba(0,0,0,0.42) 18px 21px, transparent 21px),
                linear-gradient(0deg, transparent 15px, rgba(255,255,255,0.16) 15px 18px, rgba(0,0,0,0.42) 18px 21px, transparent 21px);
        }

        .book-spine:hover {
            transform: translateY(-20px) scale(1.05);
        }

        .book-spine.wobble {
            animation: wobble 1s infinite ease-in-out alternate;
        }

        @keyframes wobble {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .spine-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: var(--font-serif);
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            text-shadow: 0 1px 0 rgba(0,0,0,0.8), 0 0 12px rgba(240,223,180,0.28);
            transform: rotate(180deg);
            pointer-events: none;
            position: relative;
            z-index: 2;
            max-height: 86%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .desk-texture {
            background-color: #4e342e;
            background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        }

        .perspective-2000 {
            perspective: 2000px;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        /* Centrado dinámico al abrir */
        .book-inner {
            transform: translateX(0);
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .is-open .book-inner {
            transform: translateX(25%);
        }
        /* En móvil el libro ocupa casi todo el ancho: cualquier desplazamiento
           lo saca de la pantalla y corta el texto de la página. */
        @media (max-width: 768px) {
            .is-open .book-inner {
                transform: translateX(0);
            }
        }

        .cover-front-3d {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            z-index: 30;
            transform: translateZ(5px);
        }

        .is-open .cover-front-3d {
            transform: rotateY(-170deg) translateZ(5px);
        }

        .cover-face-front, .cover-face-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 2px 18px 18px 2px;
        }

        .cover-face-front {
            box-shadow:
                inset -2px 0 0 rgba(255,255,255,0.09),
                inset 0 2px 0 rgba(255,255,255,0.07),
                inset 6px 0 26px rgba(0,0,0,0.55),
                6px 8px 26px rgba(0,0,0,0.55);
            /* El color de la piel lo inyecta JS; aquí van grano, brillo y la
               sombra del cajo, la zona donde la tapa se dobla contra el lomo. */
            background-image:
                var(--grain),
                linear-gradient(135deg, rgba(255,255,255,0.13) 0%, transparent 48%),
                linear-gradient(90deg, rgba(0,0,0,0.55) 0 14px, rgba(0,0,0,0.18) 14px 26px, transparent 26px);
            background-blend-mode: overlay, normal, normal;
        }

        #cover-title {
            font-family: var(--font-serif);
            letter-spacing: 0.015em;
            text-shadow:
                0 -1px 0 rgba(255,255,255,0.22),
                0 2px 1px rgba(0,0,0,0.6),
                0 8px 22px rgba(0,0,0,0.55);
        }

        .cover-face-back {
            transform: rotateY(180deg);
            background-color: #cfc0a2;
            background-image:
                var(--grain),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.035) 10px, rgba(0,0,0,0.035) 20px);
            background-blend-mode: multiply, normal;
            box-shadow: inset 0 0 34px rgba(0,0,0,0.35), inset -6px 0 16px rgba(0,0,0,0.28);
            border-radius: 18px 2px 2px 18px;
        }

        #book-back-cover {
            transform: translateZ(-5px);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7);
        }

        .pages-3d {
            position: absolute;
            top: 8px; left: 12px;
            width: calc(100% - 20px);
            height: calc(100% - 16px);
            background: var(--paper-color);
            border-radius: 2px 12px 12px 2px;
            box-shadow: inset 22px 0 34px -22px rgba(80,60,30,0.5), inset 0 0 40px rgba(0,0,0,0.05);
            border-right: 5px solid #e3d5b1;
            border-bottom: 5px solid #e3d5b1;
            z-index: 10;
            transform: translateZ(0);
        }

        /* Grano del papel, por encima del color y por debajo del contenido */
        .pages-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: var(--grain);
            opacity: 0.28;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 0;
        }

        .page-content-scroll {
            width: 100%; height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 25px;
            position: relative;
        }

        /* Líneas estilo libreta */
        .custom-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--paper-lines) 31px, var(--paper-lines) 32px);
            line-height: 32px;
            background-attachment: local;
        }

        /* Texto de las entradas: manuscrito, asentado sobre el renglón */
        .hand-text {
            font-family: var(--font-hand);
            font-size: 1.5rem;
            line-height: 32px;
            color: var(--ink);
        }
        .hand-text::placeholder { color: rgba(93, 98, 116, 0.42); }

        .ink { color: var(--ink); }
        .ink-soft { color: var(--ink-soft); }

        /* Controles discretos: en una página escrita, un botón de app canta mucho */
        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            border: 1px solid #cbbd9b;
            border-radius: 999px;
            background: rgba(255,255,255,0.35);
            color: var(--ink-soft);
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .pill:hover { background: rgba(0,0,0,0.045); border-color: #b6a684; color: var(--ink); }
        .pill svg { flex: none; }

        /* Solo mientras graba se permite el rojo */
        #record-btn.rec-on {
            color: #b3261e;
            border-color: #d9a3a0;
            background: rgba(179,38,30,0.06);
        }

        /* Estilo Polaroid */
        .polaroid {
            background: #fff;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #eee;
            position: relative;
        }
        .polaroid::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.4);
            pointer-events: none;
        }

        /* Punto de libro */
        .bookmark {
            position: absolute;
            top: -15px; 
            right: 30px;
            width: 35px;
            height: 70px;
            background-color: #2c3e50;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.4s;
            cursor: pointer;
            z-index: 50;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        }
        .bookmark.active {
            top: 0px; 
            background-color: #e74c3c; 
        }

        /* Botón de grabar animado */
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- Selector de idioma --- */
        .flag-svg {
            width: 28px;
            height: 19px;
            display: block;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            background: #1d1511;
            border: 1px solid rgba(253, 230, 138, 0.2);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.7);
            z-index: 60;
            min-width: 200px;
        }
        .lang-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 9px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #fde68a;
            font-family: sans-serif;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
        }
        .lang-item:hover { background: rgba(255,255,255,0.09); }
        .lang-item.selected { background: rgba(255,255,255,0.14); font-weight: 700; color: #fff; }

        /* --- Pasar página arrastrando --- */
        /* pan-y: el navegador se queda el scroll vertical y a nosotros nos llegan
           los gestos horizontales sin que los consuma. */
        #page-scroller { touch-action: pan-y; }

        .pages-3d { perspective: 1600px; }

        .flip-under {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--paper-color);
            border-radius: 2px 12px 12px 2px;
            overflow: hidden;
            z-index: 12;
            display: none;
        }
        .flip-sheet {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            z-index: 14;
            display: none;
        }
        .flip-under.active, .flip-sheet.active { display: block; }
        .flip-under, .flip-sheet { pointer-events: none; }
        .flip-sheet.animating { transition: transform 0.5s cubic-bezier(0.25, 0.6, 0.3, 1); }

        .flip-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background: var(--paper-color);
            overflow: hidden;
            border-radius: 2px 12px 12px 2px;
            box-shadow: 0 0 25px rgba(0,0,0,0.35);
        }
        .flip-face-back {
            transform: rotateY(180deg);
            border-radius: 12px 2px 2px 12px;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(0,0,0,0.02) 12px, rgba(0,0,0,0.02) 24px);
        }
        /* Sombra del pliegue: se oscurece a medida que gira la hoja */
        .flip-shade {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0) 50%);
            opacity: 0;
        }
        .flip-replica {
            width: 100%;
            height: 100%;
            padding: 40px 25px;
            overflow: hidden;
        }

        /* Tira de polaroids (varias fotos por página) */
        .polaroid-thumb { width: 150px; }
        @media (min-width: 640px) { .polaroid-thumb { width: 175px; } }
        /* Las fotos son 1:1, así que la ventana también */
        .polaroid img { aspect-ratio: 1 / 1; object-fit: cover; cursor: zoom-in; }

        /* Recortador 1:1 */
        #crop-frame {
            position: relative;
            width: min(84vw, 62vh);
            height: min(84vw, 62vh);
            overflow: hidden;
            background: #111;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.12);
            touch-action: none;
            cursor: grab;
        }
        #crop-frame:active { cursor: grabbing; }
        #crop-canvas { display: block; width: 100%; height: 100%; }
        .crop-guides {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.22) 1px, transparent 1px);
            background-size: 33.333% 33.333%;
            background-position: 33.333% 33.333%;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }

        /* Pulsación larga sobre un tomo */
        .book-spine {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, filter 0.3s;
        }
        .book-spine.press-hold {
            transform: translateY(-16px) scale(1.07);
            filter: brightness(1.25);
            box-shadow: 0 0 0 3px rgba(253, 230, 138, 0.6), 10px 14px 22px rgba(0,0,0,0.7);
        }

        /* --- Exportación a PDF --- */
        /* El documento se maqueta en #print-root y solo existe al imprimir. */
        #print-root { display: none; }

        @media print {
            @page {
                size: A4;
                margin: 18mm 16mm 20mm 16mm;
            }

            html, body {
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }

            #library-view, #reader-view, #modal-overlay { display: none !important; }

            #print-root {
                display: block !important;
                font-family: 'Georgia', serif;
                color: #1a1a1a;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-cover {
                min-height: 210mm;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .pdf-cover-band {
                width: 62mm;
                height: 3.5mm;
                border-radius: 2mm;
                margin-bottom: 16mm;
            }
            .pdf-kicker {
                font-size: 8.5pt;
                letter-spacing: 0.38em;
                text-transform: uppercase;
                color: #7a7a7a;
                margin: 0 0 9mm;
            }
            .pdf-cover h1 {
                font-size: 34pt;
                font-weight: 700;
                line-height: 1.15;
                margin: 0;
                max-width: 130mm;
            }
            .pdf-rule {
                width: 26mm;
                height: 1px;
                background: #c9c9c9;
                margin: 10mm auto;
            }
            .pdf-meta {
                font-size: 10.5pt;
                color: #5f5f5f;
                font-style: italic;
                margin: 0 0 2mm;
            }

            /* Una entrada por hoja: la portada no lleva salto propio, lo pone cada entrada */
            .pdf-entry {
                break-before: page;
                page-break-before: always;
            }
            .pdf-runhead {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10mm;
                font-size: 7.5pt;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: #8f8f8f;
                border-bottom: 1px solid #dcdcdc;
                padding-bottom: 3mm;
                margin-bottom: 9mm;
            }
            .pdf-runhead span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .pdf-runhead span:last-child { white-space: nowrap; }

            .pdf-entry h2 {
                font-size: 21pt;
                font-weight: 700;
                line-height: 1.2;
                margin: 0 0 4mm;
            }
            .pdf-dateline {
                font-size: 9.5pt;
                color: #6b6b6b;
                font-style: italic;
                margin: 0 0 8mm;
            }

            .pdf-photos {
                display: grid;
                gap: 5mm;
                margin: 0 0 8mm;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .pdf-photos.one { grid-template-columns: 1fr; }
            .pdf-photos.many { grid-template-columns: 1fr 1fr; }
            .pdf-photos figure {
                margin: 0;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .pdf-photos img {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid #e2e2e2;
            }

            .pdf-text {
                font-size: 11.5pt;
                line-height: 1.75;
                white-space: pre-wrap;
                text-align: justify;
                hyphens: auto;
                margin: 0;
                orphans: 3;
                widows: 3;
            }
            .pdf-note {
                margin: 8mm 0 0;
                font-size: 9pt;
                color: #8f8f8f;
                font-style: italic;
            }
            .pdf-empty {
                font-size: 10pt;
                color: #a5a5a5;
                font-style: italic;
                margin: 0;
            }
        }

        let lang = 'ca';

        function t(key, vars) {
            let s = (I18N[lang] && I18N[lang][key]) || I18N.ca[key] || key;
            if(vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
            return s;
        }

        function applyTranslations() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });

            document.getElementById('lang-flag').innerHTML = FLAGS[lang];

            // Textos que se generan por JS y no llevan data-i18n
            const editBtn = document.getElementById('edit-btn');
            editBtn.innerHTML = (isEditMode ? '✓' : '✎') + `<span class="hidden sm:inline ml-1">${isEditMode ? t('done') : t('edit')}</span>`;
            setRecordButton(isRecording ? 'grabando' : 'listo');
            if(currentJournal) renderCurrentPage();
            else renderLibrary();
        }

        function setLanguage(code) {
            if(!I18N[code]) return;
            lang = code;
            try { localStorage.setItem(LANG_KEY, code); } catch(e) { /* modo privado: se queda en memoria */ }
            applyTranslations();
            closeLangMenu();
        }

        function renderLangMenu() {
            const menu = document.getElementById('lang-menu');
            menu.innerHTML = LANGS.map(code =>
                `<button class="lang-item ${code === lang ? 'selected' : ''}" onclick="setLanguage('${code}')">${FLAGS[code]}<span>${LANG_NAMES[code]}</span></button>`
            ).join('');
        }

        function toggleLangMenu(event) {
            if(event) event.stopPropagation();
            const menu = document.getElementById('lang-menu');
            if(menu.classList.contains('hidden')) {
                renderLangMenu();
                menu.classList.remove('hidden');
                document.getElementById('lang-btn').setAttribute('aria-expanded', 'true');
                setTimeout(() => document.addEventListener('click', closeLangMenu, { once: true }), 0);
            } else {
                closeLangMenu();
            }
        }

        function closeLangMenu() {
            document.getElementById('lang-menu').classList.add('hidden');
            document.getElementById('lang-btn').setAttribute('aria-expanded', 'false');
        }
        
        // --- IndexedDB Wrapper robusto ---
        const DB_NAME = 'TravelJournalDB_v2';
        const STORE_NAME = 'journals';

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, {keyPath: 'id'});
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getJournals() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveJournalDB(journal) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(journal);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deleteJournalDB(id) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        const Modal = {
            showMsg: function(title, msg, isConfirm=false, onConfirm=null) {
                document.getElementById('modal-overlay').classList.remove('hidden');
                const box = document.getElementById('modal-box');
                document.getElementById('prompt-box').classList.add('hidden');
                document.getElementById('list-box').classList.add('hidden');
                box.classList.remove('hidden');
                setTimeout(() => box.classList.remove('scale-95'), 10);
                
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = msg;
                
                const cancelBtn = document.getElementById('modal-cancel');
                const confirmBtn = document.getElementById('modal-confirm');
                
                if(isConfirm) {
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.onclick = () => this.close();
                    confirmBtn.onclick = () => { this.close(); if(onConfirm) onConfirm(); };
                } else {
                    cancelBtn.classList.add('hidden');
                    confirmBtn.onclick = () => this.close();
                }
            },
            // opts: { value, confirmText, colors: bool, color }
            // onConfirm recibe (texto, color)
            showPrompt: function(title, onConfirm, opts) {
                opts = opts || {};
                document.getElementById('modal-overlay').classList.remove('hidden');
                const box = document.getElementById('prompt-box');
                document.getElementById('modal-box').classList.add('hidden');
                document.getElementById('list-box').classList.add('hidden');
                box.classList.remove('hidden');
                setTimeout(() => box.classList.remove('scale-95'), 10);

                document.getElementById('prompt-title').textContent = title;
                document.getElementById('prompt-confirm').textContent = opts.confirmText || t('create');

                const input = document.getElementById('prompt-input');
                input.value = opts.value || '';
                setTimeout(() => { input.focus(); input.select(); }, 100);

                // Paleta de colores de cubierta (solo al renombrar)
                let chosenColor = opts.color || null;
                const colorsBox = document.getElementById('prompt-colors');
                if(opts.colors) {
                    colorsBox.classList.remove('hidden');
                    colorsBox.classList.add('flex');
                    colorsBox.innerHTML = bookColors.map(c =>
                        `<button type="button" data-color="${c}" class="w-9 h-9 rounded-full border-4 transition ${c === chosenColor ? 'border-amber-500 scale-110' : 'border-transparent'}" style="background-color:${c}"></button>`
                    ).join('');
                    colorsBox.querySelectorAll('button').forEach(b => {
                        b.onclick = () => {
                            chosenColor = b.dataset.color;
                            colorsBox.querySelectorAll('button').forEach(x => x.className = x.className.replace(/border-amber-500 scale-110|border-transparent/, 'border-transparent'));
                            b.className = b.className.replace('border-transparent', 'border-amber-500 scale-110');
                        };
                    });
                } else {
                    colorsBox.classList.add('hidden');
                    colorsBox.classList.remove('flex');
                    colorsBox.innerHTML = '';
                }

                const confirm = () => {
                    const val = input.value.trim();
                    if(val) { this.close(); onConfirm(val, chosenColor); }
                };
                document.getElementById('prompt-cancel').onclick = () => this.close();
                document.getElementById('prompt-confirm').onclick = confirm;
                input.onkeydown = (e) => { if(e.key === 'Enter') confirm(); };
            },
            // items: [{label, sub, onPick}]
            showList: function(title, items, emptyMsg) {
                document.getElementById('modal-overlay').classList.remove('hidden');
                const box = document.getElementById('list-box');
                document.getElementById('modal-box').classList.add('hidden');
                document.getElementById('prompt-box').classList.add('hidden');
                box.classList.remove('hidden');

                document.getElementById('list-title').textContent = title;

                if(items.length === 0) {
                    cont.innerHTML = `<p class="text-gray-500 text-center py-4">${escapeHtml(emptyMsg)}</p>`;
                } else {
                    cont.innerHTML = items.map((it, i) =>
                        `<button data-idx="${i}" class="w-full text-left px-3 py-3 rounded-lg hover:bg-amber-50 transition border-b border-gray-100 last:border-0 flex items-center gap-3">
                            <span class="text-amber-600 shrink-0">🔖</span>
                            <span class="min-w-0">
                                <span class="block font-medium text-gray-800 truncate">${escapeHtml(it.label)}</span>
                                <span class="block text-xs text-gray-500">${escapeHtml(it.sub)}</span>
                            </span>
                        </button>`
                    ).join('');
                    cont.querySelectorAll('button').forEach(b => {
                        b.onclick = () => { this.close(); items[b.dataset.idx].onPick(); };
                    });
                }
                document.getElementById('list-close').onclick = () => this.close();
            },
            close: function() {
                document.getElementById('modal-box').classList.add('scale-95');
                document.getElementById('prompt-box').classList.add('scale-95');
                document.getElementById('list-box').classList.add('scale-95');
                setTimeout(() => {
                    document.getElementById('modal-overlay').classList.add('hidden');
                }, 150);
            }
        };

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Migración: hasta ahora cada página tenía una sola foto en `photo`.
        // Ahora son varias en `photos[]`; los diarios antiguos se convierten al vuelo.
        function normalizePage(p) {
            if(!Array.isArray(p.photos)) p.photos = p.photo ? [p.photo] : [];
            delete p.photo;
            if(!('locationName' in p)) p.locationName = null;
            if(!('bookmarked' in p)) p.bookmarked = false;
            return p;
        }

        function normalizeJournal(j) {
            j.pages = Array.isArray(j.pages) ? j.pages.map(normalizePage) : [];
            if(j.pages.length === 0) j.pages = [createEmptyPage()];
            return j;
        }

        window.onload = async function() {
            try {
                const guardado = localStorage.getItem(LANG_KEY);
                if(guardado && I18N[guardado]) lang = guardado;
            } catch(e) { /* modo privado */ }

            try {
                journals = (await getJournals()).map(normalizeJournal);
            } catch (e) {
                console.error("No se pudo cargar la base de datos", e);
                journals = [];
            }
            applyTranslations();
            initFlipGestures();
        };

        function renderLibrary() {
            const container = document.getElementById('library-shelves');
            container.innerHTML = '';

            if(journals.length === 0) {
                container.innerHTML = `<p class="text-amber-200/50 text-xl font-serif text-center w-full mt-20">${escapeHtml(t('emptyShelf'))}<br>${escapeHtml(t('emptyShelf2'))}</p>`;
                return;
            }

            journals.forEach(journal => {
                const slot = document.createElement('div');
                slot.className = 'book-slot';

                const book = document.createElement('div');
                book.className = `book-spine ${isEditMode ? 'wobble' : ''}`;
                const forma = spineShape(journal.id);
                book.style.width = forma.w + 'px';
                book.style.height = forma.h + 'px';
                book.style.backgroundColor = journal.color;

                const title = document.createElement('div');
                title.className = 'spine-title';
                title.textContent = journal.title;
                // El título se encoge hasta caber a lo alto del lomo, en vez de cortarse
                const disponible = forma.h * 0.86;
                const porCaracter = Math.max(journal.title.length, 1) * 1.18;
                title.style.fontSize = Math.max(0.6, Math.min(1.2, disponible / porCaracter / 16)) + 'rem';
                book.appendChild(title);

                if (isEditMode) {
                    const delBtn = document.createElement('div');
                    delBtn.className = 'absolute -top-3 -right-3 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold font-sans shadow-lg z-10 cursor-pointer border-2 border-white';
                    delBtn.innerHTML = '✕';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteJournal(journal.id);
                    };
                    book.appendChild(delBtn);

                    const editBtn = document.createElement('div');
                    editBtn.className = 'absolute -top-3 -left-3 bg-amber-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-sans shadow-lg z-10 cursor-pointer border-2 border-white';
                    editBtn.innerHTML = '✎';
                    editBtn.title = t('renameJournal');
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        renameJournal(journal.id);
                    };
                    book.appendChild(editBtn);
                } else {
                    book.onclick = () => openJournal(journal);
                    book.title = t('longPressPdf');
                    attachLongPress(book, () => exportJournalPdf(journal.id));
                }

                slot.appendChild(book);
                container.appendChild(slot);
            });
        }

        // Grosor y altura del tomo derivados del id: siempre los mismos para el
        // mismo diario, pero distintos entre ellos. Una estantería con todos los
        // libros iguales no parece una estantería.
        function spineShape(id) {
            let h = 2166136261;
            for(let i = 0; i < id.length; i++) {
                h ^= id.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            h = h >>> 0;
            return {
                w: 56 + (h % 5) * 8,           // 56 a 88 px
                // >>> y no >>: el desplazamiento con signo volvía a dar negativos
                h: 196 + ((h >>> 4) % 6) * 11  // 196 a 251 px
            };
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-btn');
            btn.innerHTML = (isEditMode ? '✓' : '✎') + `<span class="hidden sm:inline ml-1">${isEditMode ? t('done') : t('edit')}</span>`;
            btn.className = isEditMode
                ? 'text-red-400 font-bold transition whitespace-nowrap'
                : 'text-amber-200 hover:text-white transition font-medium whitespace-nowrap';
            renderLibrary();
        }

        function renameJournal(id) {
            const journal = journals.find(j => j.id === id);
            if(!journal) return;
            Modal.showPrompt(t('renameJournal'), async (title, color) => {
                journal.title = title;
                if(color) journal.color = color;
                try {
                    await saveJournalDB(journal);
                } catch(err) {
                    console.error('Fallo al renombrar el diario', err);
                    Modal.showMsg(t('saveErrorTitle'), t('saveErrorMsg'));
                }
                renderLibrary();
            }, { value: journal.title, color: journal.color, colors: true, confirmText: t('save') });
        }

        function createNewJournal() {
            if(isEditMode) toggleEditMode();
            Modal.showPrompt(t('newJournalTitle'), async (title) => {
                const newJournal = {
                    id: 'journal_' + Date.now(),

                };
