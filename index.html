<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diario de Viaje Hiperrealista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --desk-bg: #2a1f18;
            --paper-color: #fdf6e3;
            --paper-lines: #e0d8c8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--desk-bg);
            overflow: hidden;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Utilidades para ocultar barras de desplazamiento pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-wood {
            background-color: #3e2723;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.4) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(to bottom, transparent, transparent 150px, rgba(0,0,0,0.6) 150px, rgba(0,0,0,0.6) 170px);
            background-attachment: local;
        }

        .shelf-container {
            display: flex;
            flex-wrap: wrap;
            padding: 40px 20px;
            gap: 20px;
            justify-content: center;
        }

        .book-spine {
            width: 70px;
            height: 220px;
            border-radius: 6px 10px 10px 6px;
            box-shadow: 
                inset 5px 0 15px rgba(0,0,0,0.5), 
                inset -3px 0 10px rgba(255,255,255,0.2), 
                8px 10px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-blend-mode: multiply;
        }

        .book-spine:hover {
            transform: translateY(-20px) scale(1.05);
        }

        .book-spine.wobble {
            animation: wobble 1s infinite ease-in-out alternate;
        }

        @keyframes wobble {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .spine-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: rgba(255,255,255,0.9);
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            transform: rotate(180deg);
            pointer-events: none;
            max-height: 85%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .desk-texture {
            background-color: #4e342e;
            background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        }

        .perspective-2000 {
            perspective: 2000px;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        /* Centrado dinámico al abrir */
        .book-inner {
            transform: translateX(0);
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .is-open .book-inner {
            transform: translateX(25%);
        }
        /* En móvil el libro ocupa casi todo el ancho: cualquier desplazamiento
           lo saca de la pantalla y corta el texto de la página. */
        @media (max-width: 768px) {
            .is-open .book-inner {
                transform: translateX(0);
            }
        }

        .cover-front-3d {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            z-index: 30;
            transform: translateZ(5px);
        }

        .is-open .cover-front-3d {
            transform: rotateY(-170deg) translateZ(5px);
        }

        .cover-face-front, .cover-face-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 2px 18px 18px 2px;
        }

        .cover-face-front {
            box-shadow: inset 5px 0 20px rgba(0,0,0,0.6), 5px 5px 20px rgba(0,0,0,0.5);
            /* Gradiente base, el color se inyecta por JS */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
        }

        .cover-face-back {
            transform: rotateY(180deg);
            background-color: #d4c5a9;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 20px);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
            border-radius: 18px 2px 2px 18px;
        }

        #book-back-cover {
            transform: translateZ(-5px);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7);
        }

        .pages-3d {
            position: absolute;
            top: 8px; left: 12px;
            width: calc(100% - 20px);
            height: calc(100% - 16px);
            background: var(--paper-color);
            border-radius: 2px 12px 12px 2px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
            border-right: 5px solid #e5d8b8;
            border-bottom: 5px solid #e5d8b8;
            z-index: 10;
            transform: translateZ(0);
        }

        .page-content-scroll {
            width: 100%; height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 25px;
            position: relative;
        }

        /* Líneas estilo libreta */
        .custom-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--paper-lines) 31px, var(--paper-lines) 32px);
            line-height: 32px;
            background-attachment: local;
        }

        /* Estilo Polaroid */
        .polaroid {
            background: #fff;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #eee;
            position: relative;
        }
        .polaroid::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.4);
            pointer-events: none;
        }

        /* Punto de libro */
        .bookmark {
            position: absolute;
            top: -15px; 
            right: 30px;
            width: 35px;
            height: 70px;
            background-color: #2c3e50;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.4s;
            cursor: pointer;
            z-index: 50;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        }
        .bookmark.active {
            top: 0px; 
            background-color: #e74c3c; 
        }

        /* Botón de grabar animado */
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div id="library-view" class="absolute inset-0 bg-wood z-10 overflow-y-auto no-scrollbar pb-32 transition-opacity duration-500">
        <div class="sticky top-0 bg-black bg-opacity-50 backdrop-blur-sm p-6 flex justify-between items-center shadow-md z-20">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-serif text-amber-100 drop-shadow-md">Mis Diarios</h1>
            <div class="flex items-center space-x-4 sm:space-x-5 text-lg sm:text-base shrink-0">
                <button onclick="exportData()" class="text-amber-200 hover:text-white transition font-medium whitespace-nowrap" title="Exportar: guardar una copia de seguridad">
                    ⤓<span class="hidden sm:inline"> Exportar</span>
                </button>
                <label class="text-amber-200 hover:text-white transition font-medium cursor-pointer whitespace-nowrap" title="Importar: restaurar desde una copia de seguridad">
                    ⤒<span class="hidden sm:inline"> Importar</span>
                    <input type="file" accept="application/json,.json" hidden onchange="handleImportFile(event)">
                </label>
                <button onclick="toggleEditMode()" id="edit-btn" class="text-amber-200 hover:text-white transition font-medium whitespace-nowrap">
                    ✎<span class="hidden sm:inline"> Editar</span>
                </button>
            </div>
        </div>
        
        <div id="library-shelves" class="shelf-container mt-4">
            <!-- Los tomos se inyectarán aquí -->
        </div>

        <button onclick="createNewJournal()" class="fixed bottom-8 right-8 bg-gradient-to-r from-amber-600 to-amber-700 text-white rounded-full p-4 shadow-2xl hover:scale-110 transition flex items-center justify-center z-20 border-2 border-amber-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        </button>
    </div>

    <div id="reader-view" class="absolute inset-0 desk-texture z-20 hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-500">
        
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-50 pointer-events-none">
            <button onclick="closeBook()" class="pointer-events-auto px-5 py-2 bg-black bg-opacity-60 text-amber-100 border border-amber-900 rounded-full hover:bg-opacity-80 transition flex items-center shadow-xl">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Cerrar Diario
            </button>
        </div>
        
        <div class="book-wrapper w-[92vw] max-w-2xl h-[85vh] max-h-[850px] perspective-2000 relative">
            <div class="book-inner w-full h-full relative preserve-3d" id="book-inner">
                
                <!-- Tapa Trasera -->
                <div class="absolute top-0 left-0 w-full h-full rounded-r-2xl rounded-l-sm z-0" id="book-back-cover"></div>

                <!-- Contenedor de Páginas (El interior del libro) -->
                <div class="pages-3d">
                    <div class="page-content-scroll relative" id="page-scroller">
                        
                        <div id="bookmark-ribbon" onclick="toggleBookmark()" class="bookmark" title="Punto de libro"></div>
                        
                        <input type="text" id="page-title" class="w-full bg-transparent text-3xl md:text-4xl font-serif text-gray-800 border-none outline-none mb-8 placeholder-gray-400 text-center font-bold" placeholder="Título de la página..." oninput="debounceSave()">
                        
                        <div class="flex flex-col items-center justify-center mb-8 relative">
                            <label id="take-photo-container" class="cursor-pointer border-2 border-dashed border-gray-400 w-full max-w-sm py-12 rounded-xl text-gray-500 hover:bg-black hover:bg-opacity-5 transition flex flex-col items-center group">
                                <span class="text-5xl mb-3 transform group-hover:scale-110 transition drop-shadow-sm">📸</span>
                                <span class="font-medium font-sans">Tomar Foto</span>
                                <!-- Input que abre directamente la cámara en móviles -->
                                <input type="file" accept="image/*" capture="environment" hidden onchange="handlePhotoCapture(event)">
                            </label>
                            
                            <div id="polaroid-container" class="hidden polaroid transform rotate-2 hover:rotate-0 transition duration-300 relative w-full max-w-sm mx-auto">
                                <button onclick="removePhoto()" class="absolute -top-4 -right-4 bg-gray-800 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 transition z-10 font-sans border-2 border-white">✕</button>
                                <img id="page-photo" class="w-full h-auto object-cover rounded-sm" src="" alt="Captura">
                            </div>
                        </div>

                        <div id="metadata-container" class="hidden w-full max-w-sm mx-auto mb-8 bg-black bg-opacity-[0.03] rounded-lg p-3 flex flex-col items-center justify-center space-y-2 text-sm text-gray-700 font-sans border border-gray-300 shadow-inner">
                            <div class="flex items-center space-x-6 font-medium">
                                <span class="flex items-center"><svg class="w-4 h-4 mr-1 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> <span id="meta-date">--/--/----</span></span>
                                <span class="flex items-center"><svg class="w-4 h-4 mr-1 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span id="meta-time">--:--</span></span>
                            </div>
                            <div class="w-3/4 h-px bg-gray-300 my-1"></div>
                            <div class="flex items-center text-blue-700 cursor-pointer hover:text-blue-900 transition font-medium" onclick="openLocation()">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span id="meta-location" class="underline">Buscando ubicación...</span>
                            </div>
                        </div>

                        <div class="w-full max-w-sm mx-auto mb-8">
                            <button id="record-btn" onclick="toggleRecording()" class="w-full bg-gradient-to-r from-red-500 to-red-600 text-white py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition flex justify-center items-center space-x-2 font-sans font-medium">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8h-2a5 5 0 01-10 0H3a7.001 7.001 0 006 6.93V17H6v2h8v-2h-3v-2z" clip-rule="evenodd"></path></svg>
                                <span id="record-text">Grabar nota de voz</span>
                            </button>
                            
                            <div id="audio-container" class="hidden bg-gray-200 rounded-xl p-3 shadow-inner relative border border-gray-300">
                                <button onclick="removeAudio()" class="absolute -top-3 -right-3 bg-gray-800 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-md text-xs hover:bg-red-600 transition font-sans border-2 border-white z-10">✕</button>
                                <audio id="page-audio" controls class="w-full h-10 outline-none"></audio>
                            </div>
                        </div>

                        <textarea id="page-text" class="w-full min-h-[350px] bg-transparent border-none outline-none resize-none font-serif text-gray-800 text-lg custom-lines p-1 mb-8" placeholder="Escribe los detalles de tu aventura aquí..." oninput="debounceSave()"></textarea>

                        <div class="flex justify-between items-center border-t border-gray-300 pt-6 font-sans">
                            <button onclick="prevPage()" class="p-2 text-gray-500 hover:text-gray-900 transition flex items-center bg-white bg-opacity-50 rounded-lg shadow-sm"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Ant.</button>
                            <span class="text-sm text-gray-600 font-bold tracking-widest bg-white bg-opacity-50 px-3 py-1 rounded-full shadow-inner" id="page-indicator">1 / 1</span>
                            <button onclick="nextPage()" class="p-2 text-gray-500 hover:text-gray-900 transition flex items-center bg-white bg-opacity-50 rounded-lg shadow-sm">Sig. <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                        </div>
                        <button onclick="addNewPage()" class="w-full mt-4 py-3 bg-transparent border-2 border-dashed border-gray-400 text-gray-600 rounded-lg hover:bg-black hover:bg-opacity-5 transition font-medium font-sans">
                            + Añadir nueva página
                        </button>
                    </div>
                </div>

                <!-- Tapa Frontal (La que se abre animada) -->
                <div class="cover-front-3d" id="book-front-cover">
                    <!-- Exterior de la tapa -->
                    <div class="cover-face-front flex flex-col items-center justify-center p-8 relative overflow-hidden" id="book-front-face">
                        <div class="absolute inset-4 border-2 border-white border-opacity-30 rounded-lg pointer-events-none" style="border-style: double; border-width: 4px;"></div>
                        <h2 class="text-4xl md:text-5xl font-serif text-center text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] z-10 font-bold leading-tight" id="cover-title">Title</h2>
                        <div class="mt-10 px-6 py-2 bg-black bg-opacity-40 rounded-full border border-white border-opacity-20 text-white text-xs md:text-sm uppercase tracking-[0.3em] z-10 shadow-inner">Diario de Viaje</div>
                    </div>
                    <!-- Interior de la tapa -->
                    <div class="cover-face-back"></div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Custom Modal System -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-70 hidden z-[100] flex items-center justify-center backdrop-blur-sm transition-opacity">
        <!-- Message/Confirm Box -->
        <div id="modal-box" class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-11/12 text-center transform scale-95 transition-transform hidden flex flex-col">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2 font-sans">Aviso</h3>
            <p id="modal-message" class="text-gray-600 mb-6 font-sans"></p>
            <div class="flex justify-center space-x-3 w-full">
                <button id="modal-cancel" class="flex-1 px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition font-medium">Cancelar</button>
                <button id="modal-confirm" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md font-medium">Aceptar</button>
            </div>
        </div>
        
        <!-- Input Prompt Box -->
        <div id="prompt-box" class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-11/12 transform scale-95 transition-transform hidden flex flex-col">
            <h3 id="prompt-title" class="text-xl font-bold text-gray-800 mb-4 font-sans text-center">Nuevo Diario</h3>
            <input type="text" id="prompt-input" class="w-full p-3 border-2 border-gray-300 rounded-lg mb-6 outline-none focus:border-amber-500 transition font-sans" placeholder="Ej. Viaje a Japón...">
            <div class="flex justify-center space-x-3 w-full">
                <button id="prompt-cancel" class="flex-1 px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition font-medium">Cancelar</button>
                <button id="prompt-confirm" class="flex-1 px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition shadow-md font-medium">Crear</button>
            </div>
        </div>
    </div>

    <script>
        // Colores realistas para las cubiertas de cuero/tela
        const bookColors = ['#4a2e1b', '#2c3e50', '#631f28', '#275239', '#8a4b1e', '#1a1c20'];
        
        // Estado de la app
        let journals = [];
        let currentJournal = null;
        let currentPageIndex = 0;
        let currentPage = null;
        let isEditMode = false;
        
        // --- IndexedDB Wrapper robusto ---
        const DB_NAME = 'TravelJournalDB_v2';
        const STORE_NAME = 'journals';

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, {keyPath: 'id'});
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getJournals() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveJournalDB(journal) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(journal);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deleteJournalDB(id) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        const Modal = {
            showMsg: function(title, msg, isConfirm=false, onConfirm=null) {
                document.getElementById('modal-overlay').classList.remove('hidden');
                const box = document.getElementById('modal-box');
                document.getElementById('prompt-box').classList.add('hidden');
                box.classList.remove('hidden');
                setTimeout(() => box.classList.remove('scale-95'), 10);
                
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = msg;
                
                const cancelBtn = document.getElementById('modal-cancel');
                const confirmBtn = document.getElementById('modal-confirm');
                
                if(isConfirm) {
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.onclick = () => this.close();
                    confirmBtn.onclick = () => { this.close(); if(onConfirm) onConfirm(); };
                } else {
                    cancelBtn.classList.add('hidden');
                    confirmBtn.onclick = () => this.close();
                }
            },
            showPrompt: function(title, onConfirm) {
                document.getElementById('modal-overlay').classList.remove('hidden');
                const box = document.getElementById('prompt-box');
                document.getElementById('modal-box').classList.add('hidden');
                box.classList.remove('hidden');
                setTimeout(() => box.classList.remove('scale-95'), 10);
                
                document.getElementById('prompt-title').textContent = title;
                const input = document.getElementById('prompt-input');
                input.value = '';
                setTimeout(() => input.focus(), 100);
                
                document.getElementById('prompt-cancel').onclick = () => this.close();
                document.getElementById('prompt-confirm').onclick = () => { 
                    const val = input.value.trim();
                    if(val) { this.close(); onConfirm(val); }
                };
            },
            close: function() {
                document.getElementById('modal-box').classList.add('scale-95');
                document.getElementById('prompt-box').classList.add('scale-95');
                setTimeout(() => {
                    document.getElementById('modal-overlay').classList.add('hidden');
                }, 150);
            }
        };

        window.onload = async function() {
            try {
                journals = await getJournals();
            } catch (e) {
                console.error("No se pudo cargar la base de datos", e);
                journals = [];
            }
            renderLibrary();
        };

        function renderLibrary() {
            const container = document.getElementById('library-shelves');
            container.innerHTML = '';
            
            if(journals.length === 0) {
                container.innerHTML = '<p class="text-amber-200/50 text-xl font-serif text-center w-full mt-20">Tu estantería está vacía.<br>Crea tu primer diario de viaje abajo.</p>';
                return;
            }

            journals.forEach(journal => {
                const book = document.createElement('div');
                book.className = `book-spine ${isEditMode ? 'wobble' : ''}`;
                book.style.backgroundColor = journal.color;
                
                const title = document.createElement('div');
                title.className = 'spine-title';
                title.textContent = journal.title;
                book.appendChild(title);

                if (isEditMode) {
                    const delBtn = document.createElement('div');
                    delBtn.className = 'absolute -top-3 -right-3 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold font-sans shadow-lg z-10 cursor-pointer border-2 border-white';
                    delBtn.innerHTML = '✕';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteJournal(journal.id);
                    };
                    book.appendChild(delBtn);
                } else {
                    book.onclick = () => openJournal(journal);
                }

                container.appendChild(book);
            });
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-btn');
            btn.innerHTML = isEditMode ? '✓<span class="hidden sm:inline"> Hecho</span>' : '✎<span class="hidden sm:inline"> Editar</span>';
            btn.className = isEditMode
                ? 'text-red-400 font-bold transition whitespace-nowrap'
                : 'text-amber-200 hover:text-white transition font-medium whitespace-nowrap';
            renderLibrary();
        }

        function createNewJournal() {
            if(isEditMode) toggleEditMode();
            Modal.showPrompt('Título del Nuevo Diario', async (title) => {
                const newJournal = {
                    id: 'journal_' + Date.now(),
                    title: title,
                    color: bookColors[Math.floor(Math.random() * bookColors.length)],
                    pages: [createEmptyPage()]
                };
                try {
                    await saveJournalDB(newJournal);
                } catch(err) {
                    console.error('Fallo al crear el diario', err);
                    Modal.showMsg('No se ha podido crear el diario',
                        'El navegador ha rechazado guardarlo. Puede que no quede espacio.');
                    return;
                }
                journals.push(newJournal);
                renderLibrary();
                openJournal(newJournal); // Abrir directamente
            });
        }

        function createEmptyPage() {
            return {
                title: '', photo: null, date: null, time: null, lat: null, lng: null,
                locationName: null, audio: null, text: '', bookmarked: false
            };
        }

        function deleteJournal(id) {
            Modal.showMsg('Eliminar Diario', '¿Estás seguro de que quieres quemar este diario? Se perderán todas sus páginas y recuerdos.', true, async () => {
                journals = journals.filter(j => j.id !== id);
                await deleteJournalDB(id);
                renderLibrary();
            });
        }

        // --- Copias de seguridad ---
        // IndexedDB vive solo en este navegador y puede purgarse. Exportar/importar
        // es la única forma de no perder los diarios al cambiar de móvil.
        function exportData() {
            if(journals.length === 0) {
                Modal.showMsg('Nada que exportar', 'Todavía no tienes ningún diario en la estantería.');
                return;
            }
            const payload = {
                format: 'diario-viajes',
                version: 1,
                exportedAt: new Date().toISOString(),
                journals: journals
            };
            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diarios-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            event.target.value = ''; // Permitir reimportar el mismo archivo
            if(!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                let incoming;
                try {
                    const data = JSON.parse(e.target.result);
                    incoming = Array.isArray(data) ? data : data.journals;
                } catch(err) {
                    incoming = null;
                }

                const valid = Array.isArray(incoming)
                    ? incoming.filter(j => j && typeof j.title === 'string' && Array.isArray(j.pages))
                    : [];

                if(valid.length === 0) {
                    Modal.showMsg('Error al importar', 'No se ha podido leer el archivo. Comprueba que es un JSON exportado desde esta app.');
                    return;
                }

                try {
                    for(const j of valid) {
                        // Los diarios se añaden, nunca sobrescriben: id nuevo si ya existe
                        const collides = !j.id || journals.some(x => x.id === j.id);
                        journals.push({
                            id: collides ? 'journal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) : j.id,
                            title: j.title,
                            color: j.color || bookColors[Math.floor(Math.random() * bookColors.length)],
                            pages: j.pages.length ? j.pages : [createEmptyPage()]
                        });
                        await saveJournalDB(journals[journals.length - 1]);
                    }
                    renderLibrary();
                    Modal.showMsg('Importación completada', `Se han añadido ${valid.length} diario(s) a tu estantería.`);
                } catch(err) {
                    console.error(err);
                    renderLibrary();
                    Modal.showMsg('Error al guardar', 'No se han podido guardar todos los diarios. Puede que no quede espacio en el navegador.');
                }
            };
            reader.readAsText(file);
        }

        function openJournal(journal) {
            currentJournal = journal;
            currentPageIndex = 0;
            
            // Configurar aspecto del libro
            document.getElementById('cover-title').textContent = journal.title;
            document.getElementById('book-front-face').style.backgroundColor = journal.color;
            document.getElementById('book-back-cover').style.backgroundColor = journal.color;
            
            // Transición de vistas
            document.getElementById('library-view').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('library-view').classList.add('hidden');
                
                const reader = document.getElementById('reader-view');
                reader.classList.remove('hidden');
                // Forzar reflow
                void reader.offsetWidth;
                reader.classList.remove('opacity-0');
                
                // Animar apertura del libro
                setTimeout(() => {
                    document.querySelector('.book-wrapper').classList.add('is-open');
                    renderCurrentPage();
                }, 300);

            }, 500);
        }

        function closeBook() {
            if(isRecording) toggleRecording(); // Parar grabación si la hay
            flushSave(); // No dejar cambios recientes sin guardar al salir

            document.querySelector('.book-wrapper').classList.remove('is-open');
            
            setTimeout(() => {
                const reader = document.getElementById('reader-view');
                reader.classList.add('opacity-0');
                
                setTimeout(() => {
                    reader.classList.add('hidden');
                    const library = document.getElementById('library-view');
                    library.classList.remove('hidden');
                    void library.offsetWidth;
                    library.classList.remove('opacity-0');
                    currentJournal = null;
                }, 500);
            }, 800); // Esperar a que se cierre la tapa
        }

        function renderCurrentPage() {
            if (!currentJournal || currentJournal.pages.length === 0) return;
            currentPage = currentJournal.pages[currentPageIndex];
            
            // Textos
            document.getElementById('page-title').value = currentPage.title || '';
            document.getElementById('page-text').value = currentPage.text || '';
            
            // Foto
            if (currentPage.photo) {
                document.getElementById('page-photo').src = currentPage.photo;
                document.getElementById('take-photo-container').classList.add('hidden');
                document.getElementById('polaroid-container').classList.remove('hidden');
            } else {
                document.getElementById('take-photo-container').classList.remove('hidden');
                document.getElementById('polaroid-container').classList.add('hidden');
            }
            
            // Metadatos (Geoloc, fecha)
            if (currentPage.date) {
                document.getElementById('meta-date').textContent = currentPage.date;
                document.getElementById('meta-time').textContent = currentPage.time;
                showLocation(currentPage);
                document.getElementById('metadata-container').classList.remove('hidden');
            } else {
                document.getElementById('metadata-container').classList.add('hidden');
            }
            
            // Audio
            const audioEl = document.getElementById('page-audio');
            if (currentPage.audio) {
                audioEl.src = currentPage.audio;
                document.getElementById('audio-container').classList.remove('hidden');
                document.getElementById('record-btn').classList.add('hidden');
            } else {
                audioEl.src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                // Sin esto el botón podría quedarse en "Procesando..." de la página anterior
                if(!isRecording) setRecordButton('listo');
            }
            
            // Punto de libro
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            
            // Paginación
            document.getElementById('page-indicator').textContent = `${currentPageIndex + 1} / ${currentJournal.pages.length}`;
            
            // Reset scroll
            document.getElementById('page-scroller').scrollTop = 0;
        }

        let saveTimeout;
        function debounceSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCurrentState, 800);
        }

        // Vuelca al disco lo que haya pendiente ANTES de cambiar de página.
        // Sin esto, el guardado retrasado se dispararía leyendo el DOM ya repintado
        // y escribiría el contenido de la página nueva encima, perdiendo lo escrito.
        function flushSave() {
            clearTimeout(saveTimeout);
            return saveCurrentState();
        }

        // Un guardado que falla (cupo de IndexedDB lleno por fotos y audios) no puede
        // pasar desapercibido: el usuario seguiría escribiendo creyendo que se guarda.
        let saveErrorNotified = false;

        async function saveCurrentState() {
            if(!currentJournal || !currentPage) return;

            currentPage.title = document.getElementById('page-title').value;
            currentPage.text = document.getElementById('page-text').value;

            currentJournal.pages[currentPageIndex] = currentPage;

            try {
                await saveJournalDB(currentJournal);
                saveErrorNotified = false;
            } catch(err) {
                console.error('Fallo al guardar el diario', err);
                if(!saveErrorNotified) {
                    saveErrorNotified = true;
                    Modal.showMsg('No se ha podido guardar',
                        'El navegador ha rechazado guardar los cambios. Puede que no quede espacio. Exporta una copia de seguridad y borra fotos o audios que ya no necesites.');
                }
                return;
            }

            // Actualizar array en memoria por si acaso
            const idx = journals.findIndex(j => j.id === currentJournal.id);
            if(idx !== -1) journals[idx] = currentJournal;
        }

        async function prevPage() {
            if(currentPageIndex > 0) {
                if(isRecording) toggleRecording(); // No seguir grabando en otra página
                await flushSave();
                currentPageIndex--;
                renderCurrentPage();
            }
        }
        async function nextPage() {
            if(currentPageIndex < currentJournal.pages.length - 1) {
                if(isRecording) toggleRecording();
                await flushSave();
                currentPageIndex++;
                renderCurrentPage();
            }
        }
        async function addNewPage() {
            if(isRecording) toggleRecording();
            await flushSave();
            currentJournal.pages.push(createEmptyPage());
            currentPageIndex = currentJournal.pages.length - 1;
            renderCurrentPage();
            saveCurrentState();
        }

        function toggleBookmark() {
            if(!currentPage) return;
            currentPage.bookmarked = !currentPage.bookmarked;
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            saveCurrentState();
        }

        function handlePhotoCapture(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // Redimensionar para no saturar IndexedDB
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    document.getElementById('page-photo').src = dataUrl;
                    document.getElementById('take-photo-container').classList.add('hidden');
                    document.getElementById('polaroid-container').classList.remove('hidden');
                    
                    currentPage.photo = dataUrl;
                    
                    // Al tomar foto, capturamos automáticamente fecha, hora y lugar
                    captureMetadata();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            Modal.showMsg('Borrar Foto', '¿Estás seguro de que quieres quitar esta foto?', true, () => {
                currentPage.photo = null;
                document.getElementById('take-photo-container').classList.remove('hidden');
                document.getElementById('polaroid-container').classList.add('hidden');
                // Borramos metadatos asociados a la foto (opcional, pero realista)
                currentPage.date = null;
                currentPage.time = null;
                currentPage.lat = null;
                currentPage.lng = null;
                currentPage.locationName = null;
                document.getElementById('metadata-container').classList.add('hidden');
                saveCurrentState();
            });
        }

        function captureMetadata() {
            // El GPS tarda: al volver puede que ya estemos en otra página, así que
            // los datos se escriben en la página donde se tomó la foto, no en la actual.
            const targetPage = currentPage;
            const now = new Date();
            targetPage.date = now.toLocaleDateString();
            targetPage.time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            document.getElementById('meta-date').textContent = targetPage.date;
            document.getElementById('meta-time').textContent = targetPage.time;
            document.getElementById('meta-location').textContent = "Buscando ubicación...";
            document.getElementById('metadata-container').classList.remove('hidden');
            saveCurrentState();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        targetPage.lat = position.coords.latitude;
                        targetPage.lng = position.coords.longitude;
                        targetPage.locationName = null;
                        saveCurrentState();
                        if(currentPage === targetPage) showLocation(targetPage);
                    },
                    (error) => {
                        if(currentPage === targetPage) {
                            document.getElementById('meta-location').textContent = "Ubicación no disponible";
                        }
                        console.warn("Geolocalización fallida", error);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        // Devuelve el nombre del sitio, o null si no se ha podido averiguar.
        // Null en vez de las coordenadas para no cachear un fallo de red como si
        // fuese el nombre definitivo del lugar: así se reintenta más adelante.
        async function reverseGeocode(lat, lng) {
            try {
                // API Gratuita de OpenStreetMap para obtener el nombre de la ciudad
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                const a = data.address || {};
                return a.city || a.town || a.village || a.county || null;
            } catch(e) {
                return null;
            }
        }

        function coordsLabel(lat, lng) {
            return `Lat: ${lat.toFixed(2)}, Lng: ${lng.toFixed(2)}`;
        }

        // Pinta la ubicación de una página concreta. El nombre se guarda en la propia
        // página: sin caché se pedía a Nominatim en cada render (su límite es 1 petición
        // por segundo) y, al pasar páginas rápido, la respuesta de una página anterior
        // acababa pintada sobre la que se estaba viendo.
        function showLocation(page) {
            const el = document.getElementById('meta-location');

            if(!page.lat) {
                el.textContent = 'Ubicación desconocida';
                return;
            }
            if(page.locationName) {
                el.textContent = page.locationName;
                return;
            }

            el.textContent = 'Buscando ubicación...';
            reverseGeocode(page.lat, page.lng).then(name => {
                if(name) {
                    page.locationName = name;
                    saveCurrentState();
                }
                if(currentPage === page) {
                    el.textContent = name || coordsLabel(page.lat, page.lng);
                }
            });
        }

        function openLocation() {
            if(currentPage && currentPage.lat && currentPage.lng) {
                window.open(`https://www.google.com/maps?q=${currentPage.lat},${currentPage.lng}`, '_blank');
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingStream;

        const MIC_ICON = `<svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8h-2a5 5 0 01-10 0H3a7.001 7.001 0 006 6.93V17H6v2h8v-2h-3v-2z" clip-rule="evenodd"></path></svg>`;

        function setRecordButton(state) {
            const btn = document.getElementById('record-btn');
            btn.classList.toggle('recording-pulse', state === 'grabando');
            if(state === 'grabando') {
                btn.innerHTML = `<span class="w-3 h-3 bg-white rounded-full animate-ping mr-3"></span> <span id="record-text">Detener grabación</span>`;
            } else if(state === 'procesando') {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">Procesando...</span>`;
            } else {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">Grabar nota de voz</span>`;
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');

            if(isRecording) {
                // Parar grabación
                mediaRecorder.stop();
                if(recordingStream) {
                    recordingStream.getTracks().forEach(track => track.stop());
                }
                isRecording = false;
                setRecordButton('procesando');

            } else {
                // Iniciar grabación
                try {
                    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const rec = new MediaRecorder(recordingStream);
                    mediaRecorder = rec;
                    audioChunks = [];

                    // Página y diario a los que pertenece esta grabación. El volcado a
                    // data URL es asíncrono: para cuando termina, el usuario puede haber
                    // pasado de página o cerrado el diario, y el audio debe guardarse
                    // donde se grabó, no donde se esté en ese momento.
                    const targetPage = currentPage;
                    const targetJournal = currentJournal;

                    rec.ondataavailable = e => {
                        if(e.data.size > 0) audioChunks.push(e.data);
                    };

                    rec.onstop = () => {
                        // Safari/iOS graba en audio/mp4, no en webm. Con el tipo fijo a
                        // "audio/webm" el data URL quedaba mal etiquetado y el iPhone no
                        // podía reproducir la nota de voz.
                        const audioBlob = new Blob(audioChunks, { type: rec.mimeType || 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            if(!targetPage) return;
                            targetPage.audio = dataUrl;

                            setRecordButton('listo');
                            if(currentPage === targetPage) {
                                document.getElementById('page-audio').src = dataUrl;
                                document.getElementById('audio-container').classList.remove('hidden');
                                btn.classList.add('hidden'); // Ocultar botón
                            }

                            if(currentJournal === targetJournal) {
                                saveCurrentState();
                            } else if(targetJournal) {
                                // El diario ya está cerrado: guardarlo directamente
                                saveJournalDB(targetJournal).catch(err => console.error('Fallo al guardar el audio', err));
                            }
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    rec.start();
                    isRecording = true;
                    setRecordButton('grabando');

                } catch(err) {
                    console.error(err);
                    Modal.showMsg('Error de Micrófono', 'No se pudo acceder al micrófono. Comprueba los permisos de tu navegador.');
                }
            }
        }

        function removeAudio() {
            Modal.showMsg('Borrar Audio', '¿Quieres eliminar esta nota de voz?', true, () => {
                currentPage.audio = null;
                document.getElementById('page-audio').src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                saveCurrentState();
            });
        }
    </script>
</body>
</html>
