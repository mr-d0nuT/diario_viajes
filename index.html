                    await saveJournalDB(newJournal);
                } catch(err) {
                    console.error('Fallo al crear el diario', err);
                    Modal.showMsg(t('createErrorTitle'), t('createErrorMsg'));
                    return;
                }
                journals.push(newJournal);
                renderLibrary();
                openJournal(newJournal); // Abrir directamente
            });
        }

        function createEmptyPage() {
            // photos[] y no photo: quien se salte esto rompe el adjuntar fotos en
            // todo lo que se cree dentro de la sesión, porque normalizePage solo
            // pasa por lo que viene de la base de datos o de una importación.
            return {
                title: '', photos: [], date: null, time: null, lat: null, lng: null,
                locationName: null, audio: null, text: '', bookmarked: false
            };
        }

        function deleteJournal(id) {
            Modal.showMsg(t('deleteJournalTitle'), t('deleteJournalMsg'), true, async () => {
                journals = journals.filter(j => j.id !== id);
                await deleteJournalDB(id);
                renderLibrary();
            });
        }

        // --- Copias de seguridad ---
        // IndexedDB vive solo en este navegador y puede purgarse. Exportar/importar
        // es la única forma de no perder los diarios al cambiar de móvil.
        function exportData() {
            if(journals.length === 0) {
                Modal.showMsg(t('nothingToExportTitle'), t('nothingToExportMsg'));
                return;
            }
            const payload = {
                format: 'diario-viajes',
                version: 1,
                exportedAt: new Date().toISOString(),
                journals: journals
            };
            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diarios-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            event.target.value = ''; // Permitir reimportar el mismo archivo
            if(!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                let incoming;
                try {
                    const data = JSON.parse(e.target.result);
                    incoming = Array.isArray(data) ? data : data.journals;
                } catch(err) {
                    incoming = null;
                }

                const valid = Array.isArray(incoming)
                    ? incoming.filter(j => j && typeof j.title === 'string' && Array.isArray(j.pages))
                    : [];

                if(valid.length === 0) {
                    Modal.showMsg(t('importErrorTitle'), t('importErrorMsg'));
                    return;
                }

                try {
                    for(const j of valid) {
                        // Los diarios se añaden, nunca sobrescriben: id nuevo si ya existe
                        const collides = !j.id || journals.some(x => x.id === j.id);
                        journals.push(normalizeJournal({
                            id: collides ? 'journal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) : j.id,
                            title: j.title,
                            color: j.color || bookColors[Math.floor(Math.random() * bookColors.length)],
                            pages: j.pages
                        }));
                        await saveJournalDB(journals[journals.length - 1]);
                    }
                    renderLibrary();
                    Modal.showMsg(t('importOkTitle'), t('importOkMsg', { n: valid.length }));
                } catch(err) {
                    console.error(err);
                    renderLibrary();
                    Modal.showMsg(t('importSaveErrorTitle'), t('importSaveErrorMsg'));
                }
            };
            reader.readAsText(file);
        }

        // --- Pulsación larga ---
        const LONG_PRESS_MS = 550;

        function attachLongPress(el, accion) {
            let timer = null;
            let inicio = null;
            let disparado = false;

            const cancelar = () => {
                clearTimeout(timer);
                timer = null;
                el.classList.remove('press-hold');
            };

            el.addEventListener('pointerdown', (e) => {
                if(e.pointerType === 'mouse' && e.button !== 0) return;
                disparado = false;
                inicio = { x: e.clientX, y: e.clientY };
                el.classList.add('press-hold');
                timer = setTimeout(() => {
                    disparado = true;
                    cancelar();
                    if(navigator.vibrate) navigator.vibrate(18);
                    accion();
                }, LONG_PRESS_MS);
            });

            el.addEventListener('pointermove', (e) => {
                if(!inicio || !timer) return;
                // Si el dedo se mueve, ya no es una pulsación: es un arrastre
                if(Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 10) cancelar();
            });

            el.addEventListener('pointerup', cancelar);
            el.addEventListener('pointercancel', cancelar);
            el.addEventListener('pointerleave', cancelar);

            // Tras una pulsación larga llega un click: hay que impedir que abra el diario
            el.addEventListener('click', (e) => {
                if(disparado) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    disparado = false;
                }
            }, true);

            // En móvil, mantener pulsado abre el menú del navegador
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        // --- Exportar un diario a PDF ---
        // Se maqueta un documento aparte y se deja imprimir al navegador: el texto
        // sale vectorial y seleccionable, y no hace falta ninguna librería.
        const TITULO_ORIGINAL = document.title;

        function pdfDateRange(journal) {
            const fechas = journal.pages.map(p => p.date).filter(Boolean);
            if(fechas.length === 0) return '';
            const primera = fechas[0];
            const ultima = fechas[fechas.length - 1];
            return primera === ultima ? primera : `${primera} — ${ultima}`;
        }

        function buildPrintDocument(journal) {
            const total = journal.pages.length;

            const entradas = journal.pages.map((page, i) => {
                const fotos = page.photos || [];
                const bloqueFotos = fotos.length
                    ? `<div class="pdf-photos ${fotos.length === 1 ? 'one' : 'many'}">${
                        fotos.map(src => `<figure><img src="${src}" alt=""></figure>`).join('')
                      }</div>`
                    : '';

                const linea = [page.date, page.time, page.locationName].filter(Boolean).join(' · ');
                const texto = (page.text || '').trim();
                const sinNada = !texto && fotos.length === 0;

                return `
                    <section class="pdf-entry">
                        <div class="pdf-runhead">
                            <span>${escapeHtml(journal.title)}</span>
                            <span>${escapeHtml(t('pdfPageOf', { n: i + 1, total }))}</span>
                        </div>
                        ${page.title ? `<h2>${escapeHtml(page.title)}</h2>` : ''}
                        ${linea ? `<p class="pdf-dateline">${escapeHtml(linea)}</p>` : ''}
                        ${bloqueFotos}
                        ${texto ? `<p class="pdf-text">${escapeHtml(texto)}</p>` : ''}
                        ${sinNada ? `<p class="pdf-empty">—</p>` : ''}
                        ${page.audio ? `<p class="pdf-note">${escapeHtml(t('pdfAudioNote'))}</p>` : ''}
                    </section>`;
            }).join('');

            const rango = pdfDateRange(journal);
            const recuento = total === 1 ? t('pdfPagesCount1') : t('pdfPagesCount', { n: total });

            document.getElementById('print-root').innerHTML = `
                <div class="pdf-cover">
                    <div class="pdf-cover-band" style="background:${journal.color}"></div>
                    <p class="pdf-kicker">${escapeHtml(t('coverBadge'))}</p>
                    <h1>${escapeHtml(journal.title)}</h1>
                    <div class="pdf-rule"></div>
                    ${rango ? `<p class="pdf-meta">${escapeHtml(rango)}</p>` : ''}
                    <p class="pdf-meta">${escapeHtml(recuento)}</p>
                </div>
                ${entradas}`;
        }

        function exportarPorImpresion(journal) {
            buildPrintDocument(journal);
            // El navegador usa el título del documento como nombre del PDF
            document.title = journal.title;

            const limpiar = () => {
                document.getElementById('print-root').innerHTML = '';
                document.title = TITULO_ORIGINAL;
            };
            window.addEventListener('afterprint', limpiar, { once: true });

            window.print();
        }

        // --- Generación directa del PDF con jsPDF ---
        // jsPDF vive en assets/ y se carga la primera vez que se exporta: son 420 KB
        // que no tienen por qué pesar en cada arranque de la app.
        let jsPDFPromise = null;

        function loadJsPDF() {
            if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
            if(!jsPDFPromise) {
                jsPDFPromise = new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'assets/jspdf.umd.min.js';
                    s.onload = () => (window.jspdf && window.jspdf.jsPDF)
                        ? resolve(window.jspdf.jsPDF)
                        : reject(new Error('jsPDF cargado pero no expone jsPDF'));
                    s.onerror = () => reject(new Error('No se pudo cargar assets/jspdf.umd.min.js'));
                    document.head.appendChild(s);
                }).catch(err => { jsPDFPromise = null; throw err; });
            }
            return jsPDFPromise;
        }

        const PDF_MARGEN_X = 16;
        const PDF_MARGEN_SUP = 18;
        const PDF_MARGEN_INF = 20;
        const PDF_ANCHO = 210 - PDF_MARGEN_X * 2;    // 178 mm de caja de texto
        const PDF_LIMITE_Y = 297 - PDF_MARGEN_INF;
        const PT = 0.3527777;                        // 1 punto tipográfico en mm

        // Las mismas fuentes que en pantalla, incrustadas en el PDF. jsPDF solo
        // entiende TTF, así que en assets/fonts hay woff2 para la web y ttf para aquí.
        const PDF_FUENTES = [
            { archivo: 'assets/fonts/cormorant-regular.ttf',  vfs: 'Cormorant-Regular.ttf',  nombre: 'Cormorant', estilo: 'normal' },
            { archivo: 'assets/fonts/cormorant-semibold.ttf', vfs: 'Cormorant-SemiBold.ttf', nombre: 'Cormorant', estilo: 'bold' },
            { archivo: 'assets/fonts/caveat.ttf',             vfs: 'Caveat-Regular.ttf',     nombre: 'Caveat',    estilo: 'normal' }
        ];
        let fuentesPdfB64 = null;

        async function cargarFuentesPdf() {
            if(fuentesPdfB64) return fuentesPdfB64;
            const leer = async (url) => {
                const buf = await (await fetch(url)).arrayBuffer();
                const bytes = new Uint8Array(buf);
                let bin = '';
                const trozo = 8192;   // en trozos: apply() peta con arrays enormes
                for(let i = 0; i < bytes.length; i += trozo) {
                    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + trozo));
                }
                return btoa(bin);
            };
            fuentesPdfB64 = await Promise.all(PDF_FUENTES.map(f => leer(f.archivo)));
            return fuentesPdfB64;
        }

        function registrarFuentes(doc, b64) {
            PDF_FUENTES.forEach((f, i) => {
                doc.addFileToVFS(f.vfs, b64[i]);
                doc.addFont(f.vfs, f.nombre, f.estilo);
            });
        }

        const PDF_TINTA = [26, 26, 26];
        const PDF_GRIS = [107, 107, 107];
        const PDF_GRIS_CLARO = [143, 143, 143];
        const PDF_BORDE_FOTO = [226, 226, 226];

        function hexARgb(hex) {
            const h = String(hex || '#000000').replace('#', '');
            return [parseInt(h.slice(0, 2), 16) || 0, parseInt(h.slice(2, 4), 16) || 0, parseInt(h.slice(4, 6), 16) || 0];
        }

        // Las fuentes estándar del PDF solo cubren WinAnsi. Si el diario tiene chino,
        // ruso, griego... jsPDF los escribiría mal, así que para esos se usa el
        // diálogo de impresión, que sí usa las fuentes del sistema.
        const WINANSI_EXTRA = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';

        function esRepresentableEnPdf(texto) {
            for(const ch of String(texto == null ? '' : texto)) {
                if(ch.codePointAt(0) <= 0xFF) continue;
                if(WINANSI_EXTRA.includes(ch)) continue;
                return false;
            }
            return true;
        }

        function pdfNecesitaImpresion(journal) {
            // Tanto el contenido como las etiquetas del idioma actual
            const etiquetas = t('coverBadge') + t('pdfAudioNote') + t('pdfPageOf', { n: 1, total: 1 }) + t('pdfPagesCount', { n: 2 }) + t('pdfPagesCount1');
            if(!esRepresentableEnPdf(etiquetas)) return true;
            if(!esRepresentableEnPdf(journal.title)) return true;
            return !journal.pages.every(p =>
                esRepresentableEnPdf(p.title) && esRepresentableEnPdf(p.text) &&
                esRepresentableEnPdf(p.locationName) && esRepresentableEnPdf(p.date) && esRepresentableEnPdf(p.time));
        }

        function pdfFormatoImagen(src) {
            return String(src).startsWith('data:image/png') ? 'PNG' : 'JPEG';
        }

        // Encabezado corrido: se repite en cada hoja, también en las de continuación
        function pdfCabecera(doc, journal, n, total) {
            doc.setFont('Cormorant', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(...PDF_GRIS_CLARO);
            doc.setCharSpace(0.5);

            const etiqueta = t('pdfPageOf', { n, total }).toUpperCase();
            const anchoEtiqueta = doc.getTextWidth(etiqueta);
            doc.text(etiqueta, PDF_MARGEN_X + PDF_ANCHO, PDF_MARGEN_SUP, { align: 'right' });

            let titulo = String(journal.title).toUpperCase();
            while(titulo.length > 4 && doc.getTextWidth(titulo) > PDF_ANCHO - anchoEtiqueta - 10) {
                titulo = titulo.slice(0, -2) + '…';
            }
            doc.text(titulo, PDF_MARGEN_X, PDF_MARGEN_SUP);
            doc.setCharSpace(0);

            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.2);
            doc.line(PDF_MARGEN_X, PDF_MARGEN_SUP + 3, PDF_MARGEN_X + PDF_ANCHO, PDF_MARGEN_SUP + 3);

            return PDF_MARGEN_SUP + 12;
        }

        // El cuerpo va en la misma manuscrita que la pantalla. Sin justificar: una
        // letra a mano con los espacios estirados para cuadrar el margen canta muchísimo.
        function pdfTexto(doc, texto, y, journal, n, total) {
            const tam = 15;
            const alturaLinea = tam * 1.32 * PT;

            const estiloCuerpo = () => {
                doc.setFont('Caveat', 'normal');
                doc.setFontSize(tam);
                doc.setTextColor(...PDF_TINTA);
            };
            estiloCuerpo();

            for(const parrafo of String(texto).split('\n')) {
                if(parrafo.trim() === '') { y += alturaLinea * 0.6; continue; }

                for(const linea of doc.splitTextToSize(parrafo, PDF_ANCHO)) {
                    if(y + alturaLinea > PDF_LIMITE_Y) {
                        doc.addPage();
                        y = pdfCabecera(doc, journal, n, total);
                        estiloCuerpo();
                    }
                    doc.text(linea, PDF_MARGEN_X, y);
                    y += alturaLinea;
                }
                y += alturaLinea * 0.5;
            }
            return y;
        }

        function pdfFotos(doc, fotos, y, journal, n, total) {
            const props = fotos.map(src => {
                try {
                    const p = doc.getImageProperties(src);
                    return { src, ratio: p.height / p.width };
                } catch(e) {
                    return { src, ratio: 0.75 };
                }
            });

            // Una polaroid: cartón blanco, ventana cuadrada y el margen de abajo
            // más ancho que los otros tres.
            const polaroid = (f, x, yy, ancho) => {
                const margen = ancho * 0.055;
                const ventana = ancho - margen * 2;
                const pie = ancho * 0.17;
                const alto = margen + ventana + pie;

                doc.setFillColor(0, 0, 0);
                doc.setGState(new doc.GState({ opacity: 0.13 }));
                doc.roundedRect(x + 0.9, yy + 1.2, ancho, alto, 0.6, 0.6, 'F');
                doc.setGState(new doc.GState({ opacity: 1 }));

                doc.setFillColor(255, 255, 255);
                doc.setDrawColor(...PDF_BORDE_FOTO);
                doc.setLineWidth(0.2);
                doc.roundedRect(x, yy, ancho, alto, 0.6, 0.6, 'FD');

                // La foto se ajusta dentro de la ventana sin deformarse
                let iw = ventana, ih = ventana * f.ratio;
                if(ih > ventana) { ih = ventana; iw = ventana / f.ratio; }
                doc.addImage(f.src, pdfFormatoImagen(f.src),
                    x + margen + (ventana - iw) / 2, yy + margen + (ventana - ih) / 2, iw, ih);

                return alto;
            };

            const altoPolaroid = (ancho, ratio) => ancho * 0.055 + (ancho - ancho * 0.11) + ancho * 0.17;

            if(props.length === 1) {
                const ancho = Math.min(96, PDF_ANCHO);
                const alto = altoPolaroid(ancho);
                if(y + alto > PDF_LIMITE_Y) {
                    doc.addPage();
                    y = pdfCabecera(doc, journal, n, total);
                }
                polaroid(props[0], PDF_MARGEN_X + (PDF_ANCHO - ancho) / 2, y, ancho);
                return y + alto + 9;
            }

            const hueco = 8;
            const colW = (PDF_ANCHO - hueco) / 2;
            const altoFila = altoPolaroid(colW);
            for(let i = 0; i < props.length; i += 2) {
                if(y + altoFila > PDF_LIMITE_Y) {
                    doc.addPage();
                    y = pdfCabecera(doc, journal, n, total);
                }
                props.slice(i, i + 2).forEach((f, k) => {
                    polaroid(f, PDF_MARGEN_X + k * (colW + hueco), y, colW);
                });
                y += altoFila + hueco;
            }
            return y + 2;
        }

        function pdfPortada(doc, journal) {
            const total = journal.pages.length;
            const rango = pdfDateRange(journal);
            const recuento = total === 1 ? t('pdfPagesCount1') : t('pdfPagesCount', { n: total });
            const centro = 105;

            doc.setFont('Cormorant', 'bold');
            doc.setFontSize(34);
            const lineasTitulo = doc.splitTextToSize(String(journal.title), 130);
            const altoTitulo = lineasTitulo.length * 34 * 1.15 * PT;

            const altoBloque = 3.5 + 16 + 9 + altoTitulo + 20 + (rango ? 5.5 : 0) + 5;
            let y = (297 - altoBloque) / 2;

            doc.setFillColor(...hexARgb(journal.color));
            doc.roundedRect(centro - 31, y, 62, 3.5, 1.75, 1.75, 'F');
            y += 3.5 + 16;

            doc.setFont('times', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(122, 122, 122);
            doc.setCharSpace(1.4);
            doc.text(t('coverBadge').toUpperCase(), centro, y, { align: 'center' });
            doc.setCharSpace(0);
            y += 9;

            doc.setFont('Cormorant', 'bold');
            doc.setFontSize(34);
            doc.setTextColor(...PDF_TINTA);
            lineasTitulo.forEach(l => {
                y += 34 * 1.15 * PT;
                doc.text(l, centro, y, { align: 'center' });
            });

            y += 10;
            doc.setDrawColor(201, 201, 201);
            doc.setLineWidth(0.2);
            doc.line(centro - 13, y, centro + 13, y);
            y += 10;

            doc.setFont('Cormorant', 'normal');
            doc.setFontSize(10.5);
            doc.setTextColor(95, 95, 95);
            if(rango) { doc.text(rango, centro, y, { align: 'center' }); y += 5.5; }
            doc.text(recuento, centro, y, { align: 'center' });
        }

        function nombreArchivoPdf(titulo) {
            const limpio = String(titulo).replace(/[\\/:*?"<>|]/g, '-').trim();
            return (limpio || 'diari') + '.pdf';
        }

        async function generarPdfConLibreria(journal) {
            const [jsPDF, b64] = await Promise.all([loadJsPDF(), cargarFuentesPdf()]);
            const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
            registrarFuentes(doc, b64);
            const total = journal.pages.length;

            pdfPortada(doc, journal);

            journal.pages.forEach((page, i) => {
                doc.addPage();
                let y = pdfCabecera(doc, journal, i + 1, total);

                if(page.title) {
                    doc.setFont('Cormorant', 'bold');
                    doc.setFontSize(21);
                    doc.setTextColor(...PDF_TINTA);
                    doc.splitTextToSize(String(page.title), PDF_ANCHO).forEach(l => {
                        doc.text(l, PDF_MARGEN_X, y);
                        y += 21 * 1.2 * PT;
                    });
                    y += 2;
                }

                const linea = [page.date, page.time, page.locationName].filter(Boolean).join(' · ');
                if(linea) {
                    doc.setFont('Cormorant', 'normal');
                    doc.setFontSize(9.5);
                    doc.setTextColor(...PDF_GRIS);
                    doc.text(linea, PDF_MARGEN_X, y);
                    y += 8;
                }

                const fotos = page.photos || [];
                if(fotos.length) y = pdfFotos(doc, fotos, y, journal, i + 1, total);

                const texto = (page.text || '').trim();
                if(texto) {
                    y = pdfTexto(doc, texto, y, journal, i + 1, total);
                } else if(fotos.length === 0) {
                    doc.setFont('Cormorant', 'normal');
                    doc.setFontSize(10);
                    doc.setTextColor(165, 165, 165);
                    doc.text('—', PDF_MARGEN_X, y);
                    y += 6;
                }

                if(page.audio) {
                    if(y + 8 > PDF_LIMITE_Y) {
                        doc.addPage();
                        y = pdfCabecera(doc, journal, i + 1, total);
                    }
                    doc.setFont('Cormorant', 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(...PDF_GRIS_CLARO);
                    doc.text(t('pdfAudioNote'), PDF_MARGEN_X, y + 4);
                }
            });

            doc.save(nombreArchivoPdf(journal.title));
        }

        let exportandoPdf = false;

        async function exportJournalPdf(id) {
            const journal = journals.find(j => j.id === id);
            if(!journal || exportandoPdf) return;

            // Si es el diario abierto, volcar antes lo que esté sin guardar
            if(currentJournal && currentJournal.id === id) await flushSave();

            // Idiomas o textos fuera de WinAnsi: la descarga directa no puede con ellos
            if(pdfNecesitaImpresion(journal)) {
                Modal.showMsg(t('pdfPrintFallbackTitle'), t('pdfPrintFallbackMsg'), true, () => exportarPorImpresion(journal));
                return;
            }

            exportandoPdf = true;
            try {
                await generarPdfConLibreria(journal);
            } catch(err) {
                console.error('Fallo al generar el PDF con jsPDF', err);
                // Sin la librería (por ejemplo, sin conexión la primera vez) queda el
                // diálogo de impresión, que no depende de nada.
                Modal.showMsg(t('pdfPrintFallbackTitle'), t('pdfPrintFallbackMsg'), true, () => exportarPorImpresion(journal));
            } finally {
                exportandoPdf = false;
            }
        }

        function openJournal(journal) {
            currentJournal = journal;
            currentPageIndex = 0;
            
            // Configurar aspecto del libro
            document.getElementById('cover-title').textContent = journal.title;
            document.getElementById('book-front-face').style.backgroundColor = journal.color;
            document.getElementById('book-back-cover').style.backgroundColor = journal.color;
            
            // Transición de vistas
            document.getElementById('library-view').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('library-view').classList.add('hidden');
                
                const reader = document.getElementById('reader-view');
                reader.classList.remove('hidden');
                // Forzar reflow
                void reader.offsetWidth;
                reader.classList.remove('opacity-0');
                
                // Animar apertura del libro
                setTimeout(() => {
                    document.querySelector('.book-wrapper').classList.add('is-open');
                    renderCurrentPage();
                }, 300);

            }, 500);
        }

        function closeBook() {
            if(isRecording) toggleRecording(); // Parar grabación si la hay
            flushSave(); // No dejar cambios recientes sin guardar al salir

            document.querySelector('.book-wrapper').classList.remove('is-open');
            
            setTimeout(() => {
                const reader = document.getElementById('reader-view');
                reader.classList.add('opacity-0');
                
                setTimeout(() => {
                    reader.classList.add('hidden');
                    const library = document.getElementById('library-view');
                    library.classList.remove('hidden');
                    void library.offsetWidth;
                    library.classList.remove('opacity-0');
                    currentJournal = null;
                }, 500);
            }, 800); // Esperar a que se cierre la tapa
        }

        function renderCurrentPage() {
            if (!currentJournal || currentJournal.pages.length === 0) return;
            currentPage = currentJournal.pages[currentPageIndex];
            
            // Textos
            document.getElementById('page-title').value = currentPage.title || '';
            document.getElementById('page-text').value = currentPage.text || '';
            
            // Fotos
            renderPhotosStrip();

            // Metadatos (Geoloc, fecha)
            if (currentPage.date) {
                document.getElementById('meta-date').textContent = currentPage.date;
                document.getElementById('meta-time').textContent = currentPage.time;
                showLocation(currentPage);
                document.getElementById('metadata-container').classList.remove('hidden');
            } else {
                document.getElementById('metadata-container').classList.add('hidden');
            }
            
            // Audio
            const audioEl = document.getElementById('page-audio');
            if (currentPage.audio) {
                audioEl.src = currentPage.audio;
                document.getElementById('audio-container').classList.remove('hidden');
                document.getElementById('record-btn').classList.add('hidden');
            } else {
                audioEl.src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                // Sin esto el botón podría quedarse en "Procesando..." de la página anterior
                if(!isRecording) setRecordButton('listo');
            }
            
            // Punto de libro
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            
            // Paginación
            document.getElementById('page-indicator').textContent = `${currentPageIndex + 1} / ${currentJournal.pages.length}`;
            
            // Reset scroll
            document.getElementById('page-scroller').scrollTop = 0;
        }

        let saveTimeout;
        function debounceSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCurrentState, 800);
        }

        // Vuelca al disco lo que haya pendiente ANTES de cambiar de página.
        // Sin esto, el guardado retrasado se dispararía leyendo el DOM ya repintado
        // y escribiría el contenido de la página nueva encima, perdiendo lo escrito.
        function flushSave() {
            clearTimeout(saveTimeout);
            return saveCurrentState();
        }

        // Un guardado que falla (cupo de IndexedDB lleno por fotos y audios) no puede
        // pasar desapercibido: el usuario seguiría escribiendo creyendo que se guarda.
        let saveErrorNotified = false;

        async function saveCurrentState() {
            if(!currentJournal || !currentPage) return;

            currentPage.title = document.getElementById('page-title').value;
            currentPage.text = document.getElementById('page-text').value;

            currentJournal.pages[currentPageIndex] = currentPage;

            try {
                await saveJournalDB(currentJournal);
                saveErrorNotified = false;
            } catch(err) {
                console.error('Fallo al guardar el diario', err);
                if(!saveErrorNotified) {
                    saveErrorNotified = true;
                    Modal.showMsg(t('saveErrorTitle'), t('saveErrorMsg'));
                }
                return;
            }

            // Actualizar array en memoria por si acaso
            const idx = journals.findIndex(j => j.id === currentJournal.id);
            if(idx !== -1) journals[idx] = currentJournal;
        }

        // Cambio de página sin animación: el punto por el que pasan todos los caminos
        async function goToPage(index) {
            if(!currentJournal) return;
            if(index < 0 || index >= currentJournal.pages.length) return;
            if(isRecording) toggleRecording(); // No seguir grabando en otra página
            await flushSave();
            currentPageIndex = index;
            renderCurrentPage();
        }

        function prevPage() { animateFlip(-1); }
        function nextPage() { animateFlip(1); }

        async function addNewPage() {
            if(isRecording) toggleRecording();
            await flushSave();
            currentJournal.pages.push(createEmptyPage());
            currentPageIndex = currentJournal.pages.length - 1;
            renderCurrentPage();
            saveCurrentState();
        }

        function deleteCurrentPage() {
            if(!currentJournal || !currentPage) return;
            Modal.showMsg(t('deletePageTitle'), t('deletePageMsg'), true, async () => {
                if(isRecording) toggleRecording();
                // Lo que hubiera pendiente de guardar es de la página que se va
                clearTimeout(saveTimeout);

                const idx = currentPageIndex;
                currentJournal.pages.splice(idx, 1);
                if(currentJournal.pages.length === 0) currentJournal.pages.push(createEmptyPage());
                currentPageIndex = Math.min(idx, currentJournal.pages.length - 1);

                renderCurrentPage();
                await saveCurrentState();
            });
        }

        function showBookmarks() {
            if(!currentJournal) return;
            const items = [];
            currentJournal.pages.forEach((p, i) => {
                if(!p.bookmarked) return;
                items.push({
                    label: (p.title || '').trim() || t('untitled'),
                    sub: t('pageN', { n: i + 1 }) + (p.date ? ' · ' + p.date : ''),
                    onPick: () => goToPage(i)
                });
            });
            Modal.showList(t('bookmarksListTitle'), items, t('noBookmarks'));
        }

        // --- Pasar página arrastrando ---
        // La hoja que gira es una réplica visual estática: el textarea, el audio y los
        // botones no se pueden rotar en 3D de forma fiable, así que durante el gesto se
        // muestra una copia sin controles y al terminar vuelve el contenido real.
        let isFlipping = false;
        let flipState = null;

        function replicaHtml(page) {
            if(!page) return '';
            const fotos = (page.photos || []).slice(0, 3).map((src, i) =>
                `<div class="polaroid polaroid-thumb" style="transform: rotate(${photoTilt(i)}deg)"><img class="w-full h-auto object-cover rounded-sm" src="${src}" alt=""></div>`
            ).join('');
            const audio = page.audio
                ? `<div class="w-full max-w-sm mx-auto mb-6 bg-gray-200 rounded-xl p-4 border border-gray-300 text-center text-gray-500 font-sans text-sm">▶ ▬▬▬▬▬▬▬▬▬▬</div>`
                : '';
            return `
                <h2 class="text-4xl md:text-5xl font-serif ink mb-6 text-center font-bold">${escapeHtml(page.title || '')}</h2>
                ${page.date ? `<p class="text-center text-sm ink-soft font-sans -mt-3 mb-8">${escapeHtml([page.date, page.time, page.locationName].filter(Boolean).join(' · '))}</p>` : ''}
                <div class="flex flex-wrap justify-center items-start gap-6 mb-6">${fotos}</div>
                ${audio}
                <div class="hand-text custom-lines whitespace-pre-wrap p-1">${escapeHtml(page.text || '')}</div>
            `;
        }

        function flipEls() {
            return {
                sheet: document.getElementById('flip-sheet'),
                under: document.getElementById('flip-under'),
                sheetContent: document.getElementById('flip-sheet-content'),
                underContent: document.getElementById('flip-under-content'),
                shadeFront: document.getElementById('flip-shade-front'),
                shadeBack: document.getElementById('flip-shade-back')
            };
        }

        // dir: 1 hacia adelante, -1 hacia atrás. Devuelve false si no hay a dónde ir.
        function beginFlip(dir) {
            if(!currentJournal || isFlipping) return false;
            const destino = currentPageIndex + dir;
            if(destino < 0 || destino >= currentJournal.pages.length) return false;

            // El objeto de la página se actualiza en el acto, así que la réplica
            // sale con lo último escrito aunque el guardado aún esté pendiente.
            flushSave();

            const els = flipEls();
            if(dir === 1) {
                // Se va la actual y debajo espera la siguiente
                els.sheetContent.innerHTML = replicaHtml(currentJournal.pages[currentPageIndex]);
                els.underContent.innerHTML = replicaHtml(currentJournal.pages[destino]);
            } else {
                // Entra la anterior por la izquierda, sobre la actual
                els.sheetContent.innerHTML = replicaHtml(currentJournal.pages[destino]);
                els.underContent.innerHTML = replicaHtml(currentJournal.pages[currentPageIndex]);
            }
            els.under.classList.add('active');
            els.sheet.classList.add('active');

            flipState = { dir, destino, progress: 0 };
            isFlipping = true;
            setFlipProgress(0);
            return true;
        }

        function setFlipProgress(p) {
            if(!flipState) return;
            flipState.progress = p;
            const els = flipEls();
            // Adelante: de 0° a -180°. Atrás: llega desde -180° hasta 0°.
            const angle = flipState.dir === 1 ? -180 * p : -180 * (1 - p);
            els.sheet.style.transform = `rotateY(${angle}deg)`;
            // La sombra es máxima con la hoja de canto y se va con ella plana
            const sombra = Math.sin(Math.abs(angle) * Math.PI / 180);
            els.shadeFront.style.opacity = sombra * 0.55;
            els.shadeBack.style.opacity = sombra * 0.35;
        }

        function endFlip(commit) {
            if(!flipState) return;
            const els = flipEls();
            const st = flipState;

            els.sheet.classList.add('animating');
            setFlipProgress(commit ? 1 : 0);

            setTimeout(async () => {
                els.sheet.classList.remove('animating');
                if(commit) await goToPage(st.destino);
                els.sheet.classList.remove('active');
                els.under.classList.remove('active');
                els.sheet.style.transform = '';
                flipState = null;
                isFlipping = false;
            }, 520);
        }

        // Paso de página con los botones: mismo pliegue, disparado a mano
        function animateFlip(dir) {
            if(!beginFlip(dir)) return;
            void document.getElementById('flip-sheet').offsetWidth; // reflow: la transición parte del ángulo inicial
            endFlip(true);
        }

        function initFlipGestures() {
            const scroller = document.getElementById('page-scroller');
            let start = null;

            // Los controles nunca ceden el gesto.
            const CONTROLES = 'button, label, audio, a, .polaroid, #bookmark-ribbon';
            // Los campos de texto solo lo retienen con el ratón: ahí arrastrar en
            // horizontal es seleccionar. Con el dedo no hay conflicto (seleccionar
            // exige mantener pulsado antes) y sí hacía falta soltarlos: el textarea
            // ocupa media hoja, así que excluyéndolo casi no quedaba dónde arrastrar.
            const CAMPOS = 'input, textarea';

            scroller.addEventListener('pointerdown', (e) => {
                if(isFlipping || !currentJournal) return;
                if(e.pointerType === 'mouse' && e.button !== 0) return;
                if(e.target.closest(CONTROLES)) return;
                if(e.pointerType === 'mouse' && e.target.closest(CAMPOS)) return;
                start = { x: e.clientX, y: e.clientY, id: e.pointerId, decidido: false };
            });

            scroller.addEventListener('pointermove', (e) => {
                if(!start || e.pointerId !== start.id) return;
                const dx = e.clientX - start.x;
                const dy = e.clientY - start.y;

                if(!start.decidido) {
                    // Vertical: es scroll, soltamos el gesto
                    if(Math.abs(dy) > 12 && Math.abs(dy) >= Math.abs(dx)) { start = null; return; }
                    // Aún no está claro que sea horizontal: esperamos
                    if(Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                    if(!beginFlip(dx < 0 ? 1 : -1)) { start = null; return; }
                    start.decidido = true;
                    // Ya es nuestro: que el arrastre no mueva además el cursor del texto
                    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
                    // Puede fallar si el puntero ya se ha soltado: no es motivo para abortar
                    try { scroller.setPointerCapture(e.pointerId); } catch(err) { /* seguimos sin captura */ }
                }

                if(e.cancelable) e.preventDefault();
                const ancho = scroller.clientWidth || 1;
                const recorrido = flipState.dir === 1 ? -dx : dx;
                setFlipProgress(Math.max(0, Math.min(1, recorrido / ancho)));
            });

            const soltar = (e) => {
                if(!start || (e && e.pointerId !== start.id)) return;
                const decidido = start.decidido;
                start = null;
                if(decidido && flipState) endFlip(flipState.progress >= 0.35);
            };
            scroller.addEventListener('pointerup', soltar);
            scroller.addEventListener('pointercancel', soltar);
        }

        function toggleBookmark() {
            if(!currentPage) return;
            currentPage.bookmarked = !currentPage.bookmarked;
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            saveCurrentState();
        }

        // Cada polaroid se inclina un poco, siempre igual para la misma posición,
        // para que no bailen al repintar la página.
        function photoTilt(i) {
            return [-3, 2, -1.5, 3, -2.5, 1][i % 6];
        }

        function renderPhotosStrip() {
            const strip = document.getElementById('photos-strip');
            const fotos = (currentPage && currentPage.photos) || [];
            strip.innerHTML = fotos.map((src, i) => `
                <div class="polaroid polaroid-thumb relative transition duration-300 hover:rotate-0" style="transform: rotate(${photoTilt(i)}deg)">
                    <button data-idx="${i}" class="quitar-foto absolute -top-2.5 -right-2.5 rounded-full w-6 h-6 flex items-center justify-center text-xs transition z-10 font-sans border" style="background:#f6efdb; border-color:#cbbd9b; color:#5d6274">✕</button>
                    <img data-idx="${i}" class="w-full h-auto rounded-sm" src="${src}" alt="">
                </div>
            `).join('');
            strip.querySelectorAll('.quitar-foto').forEach(b => {
                b.onclick = () => removePhoto(Number(b.dataset.idx));
            });
            strip.querySelectorAll('img').forEach(im => {
                im.onclick = () => openLightbox(im.src);
            });
        }

        const FOTO_LADO = 800;   // lado del cuadrado que se guarda

        function cargarImagen(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Recorte cuadrado por el centro, sin preguntar
        function recorteCentrado(img) {
            const canvas = document.createElement('canvas');
            canvas.width = FOTO_LADO;
            canvas.height = FOTO_LADO;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, FOTO_LADO, FOTO_LADO);
            const lado = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, FOTO_LADO, FOTO_LADO);
            return canvas.toDataURL('image/jpeg', 0.72);
        }

        // Encuadre a mano. Devuelve el data URL, o null si se cancela.
        // La cámara del sistema no se puede forzar a 1:1 desde la web, así que el
        // recorte se hace después; en las de galería lo decide el usuario.
        function abrirRecorte(img) {
            return new Promise(resolve => {
                const overlay = document.getElementById('crop-overlay');
                const frame = document.getElementById('crop-frame');
                const canvas = document.getElementById('crop-canvas');
                const zoom = document.getElementById('crop-zoom');
                const ctx = canvas.getContext('2d');

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                const lado = Math.round(frame.clientWidth);
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = lado * dpr;
                canvas.height = lado * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const base = Math.max(lado / img.width, lado / img.height); // que siempre cubra
                let escala = 1;
                let ox = 0, oy = 0;

                const anchoActual = () => img.width * base * escala;
                const altoActual = () => img.height * base * escala;

                const pintar = () => {
                    // La imagen nunca puede dejar hueco dentro del cuadro
                    ox = Math.min(0, Math.max(lado - anchoActual(), ox));
                    oy = Math.min(0, Math.max(lado - altoActual(), oy));
                    ctx.fillStyle = '#111111';
                    ctx.fillRect(0, 0, lado, lado);
                    ctx.drawImage(img, ox, oy, anchoActual(), altoActual());
                };

                const ampliarHaciaElCentro = (nueva) => {
                    const k = nueva / escala;
                    ox = lado / 2 - (lado / 2 - ox) * k;
                    oy = lado / 2 - (lado / 2 - oy) * k;
                    escala = nueva;
                };

                ox = (lado - anchoActual()) / 2;
                oy = (lado - altoActual()) / 2;
                pintar();

                zoom.value = 100;
                zoom.oninput = () => { ampliarHaciaElCentro(Number(zoom.value) / 100); pintar(); };

                const punteros = new Map();
                let distInicial = 0, escalaInicial = 1;

                const onDown = (e) => {
                    try { frame.setPointerCapture(e.pointerId); } catch(err) { /* sin captura */ }
                    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if(punteros.size === 2) {
                        const [a, b] = [...punteros.values()];
                        distInicial = Math.hypot(a.x - b.x, a.y - b.y);
                        escalaInicial = escala;
                    }
                };
                const onMove = (e) => {
                    if(!punteros.has(e.pointerId)) return;
                    const antes = punteros.get(e.pointerId);
                    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if(punteros.size === 2 && distInicial > 0) {
                        const [a, b] = [...punteros.values()];
                        const dist = Math.hypot(a.x - b.x, a.y - b.y);
                        ampliarHaciaElCentro(Math.min(3.2, Math.max(1, escalaInicial * (dist / distInicial))));
                        zoom.value = Math.round(escala * 100);
                    } else if(punteros.size === 1) {
                        ox += e.clientX - antes.x;
                        oy += e.clientY - antes.y;
                    }
                    pintar();
                };
                const onUp = (e) => {
                    punteros.delete(e.pointerId);
                    if(punteros.size < 2) distInicial = 0;
                };

                frame.addEventListener('pointerdown', onDown);
                frame.addEventListener('pointermove', onMove);
                frame.addEventListener('pointerup', onUp);
                frame.addEventListener('pointercancel', onUp);

                const cerrar = (resultado) => {
                    frame.removeEventListener('pointerdown', onDown);
                    frame.removeEventListener('pointermove', onMove);
                    frame.removeEventListener('pointerup', onUp);
                    frame.removeEventListener('pointercancel', onUp);
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    resolve(resultado);
                };

                document.getElementById('crop-cancel').onclick = () => cerrar(null);
                document.getElementById('crop-confirm').onclick = () => {
                    // El mismo encuadre que se ve, escalado al tamaño de guardado
                    const f = FOTO_LADO / lado;
                    const out = document.createElement('canvas');
                    out.width = FOTO_LADO;
                    out.height = FOTO_LADO;
                    const octx = out.getContext('2d');
                    octx.fillStyle = '#ffffff';
                    octx.fillRect(0, 0, FOTO_LADO, FOTO_LADO);
                    octx.drawImage(img, ox * f, oy * f, anchoActual() * f, altoActual() * f);
                    cerrar(out.toDataURL('image/jpeg', 0.72));
                };
            });
        }

        async function handlePhotoCapture(event, modo) {
            const files = Array.from(event.target.files || []);
            event.target.value = ''; // Permitir volver a elegir la misma foto
            if(files.length === 0 || !currentPage) return;

            const targetPage = normalizePage(currentPage);
            const eraLaPrimera = targetPage.photos.length === 0;

            let añadidas = 0;
            for(const file of files) {
                let img;
                try { img = await cargarImagen(file); } catch(err) { continue; }
                const dataUrl = modo === 'galeria' ? await abrirRecorte(img) : recorteCentrado(img);
                if(dataUrl) { targetPage.photos.push(dataUrl); añadidas++; }
            }
            if(añadidas === 0) return;

            if(currentPage === targetPage) renderPhotosStrip();
            // Con la primera foto de la página capturamos fecha, hora y lugar
            if(eraLaPrimera) captureMetadata();
            else saveCurrentState();
        }

        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.classList.remove('hidden');
            lb.classList.add('flex');
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
            document.getElementById('lightbox-img').src = '';
        }

        function removePhoto(index) {
            Modal.showMsg(t('deletePhotoTitle'), t('deletePhotoMsg'), true, () => {
                if(!currentPage) return;
                normalizePage(currentPage).photos.splice(index, 1);
                // Los metadatos solo se borran al quitar la última foto de la página
                if(currentPage.photos.length === 0) {
                    currentPage.date = null;
                    currentPage.time = null;
                    currentPage.lat = null;
                    currentPage.lng = null;
                    currentPage.locationName = null;
                    document.getElementById('metadata-container').classList.add('hidden');
                }
                renderPhotosStrip();
                saveCurrentState();
            });
        }

        function captureMetadata() {
            // El GPS tarda: al volver puede que ya estemos en otra página, así que
            // los datos se escriben en la página donde se tomó la foto, no en la actual.
            const targetPage = currentPage;
            const now = new Date();
            targetPage.date = now.toLocaleDateString();
            targetPage.time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            document.getElementById('meta-date').textContent = targetPage.date;
            document.getElementById('meta-time').textContent = targetPage.time;
            document.getElementById('meta-location').textContent = t('searchingLocation');
            document.getElementById('metadata-container').classList.remove('hidden');
            saveCurrentState();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        targetPage.lat = position.coords.latitude;
                        targetPage.lng = position.coords.longitude;
                        targetPage.locationName = null;
                        saveCurrentState();
                        if(currentPage === targetPage) showLocation(targetPage);
                    },
                    (error) => {
                        if(currentPage === targetPage) {
                            document.getElementById('meta-location').textContent = t('locationUnavailable');
                        }
                        console.warn("Geolocalización fallida", error);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        // Devuelve el nombre del sitio, o null si no se ha podido averiguar.
        // Null en vez de las coordenadas para no cachear un fallo de red como si
        // fuese el nombre definitivo del lugar: así se reintenta más adelante.
        async function reverseGeocode(lat, lng) {
            try {
                // API Gratuita de OpenStreetMap para obtener el nombre de la ciudad
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                const a = data.address || {};
                return a.city || a.town || a.village || a.county || null;
            } catch(e) {
                return null;
            }
        }

        function coordsLabel(lat, lng) {
            return `Lat: ${lat.toFixed(2)}, Lng: ${lng.toFixed(2)}`;
        }

        // Pinta la ubicación de una página concreta. El nombre se guarda en la propia
        // página: sin caché se pedía a Nominatim en cada render (su límite es 1 petición
        // por segundo) y, al pasar páginas rápido, la respuesta de una página anterior
        // acababa pintada sobre la que se estaba viendo.
        function showLocation(page) {
            const el = document.getElementById('meta-location');

            if(!page.lat) {
                el.textContent = t('unknownLocation');
                return;
            }
            if(page.locationName) {
                el.textContent = page.locationName;
                return;
            }

            el.textContent = t('searchingLocation');
            reverseGeocode(page.lat, page.lng).then(name => {
                if(name) {
                    page.locationName = name;
                    saveCurrentState();
                }
                if(currentPage === page) {
                    el.textContent = name || coordsLabel(page.lat, page.lng);
                }
            });
        }

        function openLocation() {
            if(currentPage && currentPage.lat && currentPage.lng) {
                window.open(`https://www.google.com/maps?q=${currentPage.lat},${currentPage.lng}`, '_blank');
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingStream;

        const MIC_ICON = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path stroke-linecap="round" d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/></svg>`;

        function setRecordButton(state) {
            const btn = document.getElementById('record-btn');
            btn.classList.toggle('recording-pulse', state === 'grabando');
            btn.classList.toggle('rec-on', state === 'grabando');
            if(state === 'grabando') {
                btn.innerHTML = `<span class="w-2.5 h-2.5 rounded-full animate-ping" style="background:#b3261e"></span> <span id="record-text">${escapeHtml(t('stopRecording'))}</span>`;
            } else if(state === 'procesando') {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">${escapeHtml(t('processing'))}</span>`;
            } else {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">${escapeHtml(t('recordVoice'))}</span>`;
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');

            if(isRecording) {
                // Parar grabación
                mediaRecorder.stop();
                if(recordingStream) {
                    recordingStream.getTracks().forEach(track => track.stop());
                }
                isRecording = false;
                setRecordButton('procesando');

            } else {
                // Iniciar grabación
                try {
                    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const rec = new MediaRecorder(recordingStream);
                    mediaRecorder = rec;
                    audioChunks = [];

                    // Página y diario a los que pertenece esta grabación. El volcado a
                    // data URL es asíncrono: para cuando termina, el usuario puede haber
                    // pasado de página o cerrado el diario, y el audio debe guardarse
                    // donde se grabó, no donde se esté en ese momento.
                    const targetPage = currentPage;
                    const targetJournal = currentJournal;

                    rec.ondataavailable = e => {
                        if(e.data.size > 0) audioChunks.push(e.data);
                    };

                    rec.onstop = () => {
                        // Safari/iOS graba en audio/mp4, no en webm. Con el tipo fijo a
                        // "audio/webm" el data URL quedaba mal etiquetado y el iPhone no
                        // podía reproducir la nota de voz.
                        const audioBlob = new Blob(audioChunks, { type: rec.mimeType || 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            if(!targetPage) return;
                            targetPage.audio = dataUrl;

                            setRecordButton('listo');
                            if(currentPage === targetPage) {
                                document.getElementById('page-audio').src = dataUrl;
                                document.getElementById('audio-container').classList.remove('hidden');
                                btn.classList.add('hidden'); // Ocultar botón
                            }

                            if(currentJournal === targetJournal) {
                                saveCurrentState();
                            } else if(targetJournal) {
                                // El diario ya está cerrado: guardarlo directamente
                                saveJournalDB(targetJournal).catch(err => console.error('Fallo al guardar el audio', err));
                            }
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    rec.start();
                    isRecording = true;
                    setRecordButton('grabando');

                } catch(err) {
                    console.error(err);
                    Modal.showMsg(t('micErrorTitle'), t('micErrorMsg'));
                }
            }
        }

        function removeAudio() {
            Modal.showMsg(t('deleteAudioTitle'), t('deleteAudioMsg'), true, () => {
                currentPage.audio = null;
                document.getElementById('page-audio').src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                saveCurrentState();
            });
        }
    </script>
</body>
</html>
