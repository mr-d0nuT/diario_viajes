<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diario de Viaje Hiperrealista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --desk-bg: #2a1f18;
            --paper-color: #fdf6e3;
            --paper-lines: #e0d8c8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--desk-bg);
            overflow: hidden;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Utilidades para ocultar barras de desplazamiento pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-wood {
            background-color: #3e2723;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.4) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(to bottom, transparent, transparent 150px, rgba(0,0,0,0.6) 150px, rgba(0,0,0,0.6) 170px);
            background-attachment: local;
        }

        .shelf-container {
            display: flex;
            flex-wrap: wrap;
            padding: 40px 20px;
            gap: 20px;
            justify-content: center;
        }

        .book-spine {
            width: 70px;
            height: 220px;
            border-radius: 6px 10px 10px 6px;
            box-shadow: 
                inset 5px 0 15px rgba(0,0,0,0.5), 
                inset -3px 0 10px rgba(255,255,255,0.2), 
                8px 10px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-blend-mode: multiply;
        }

        .book-spine:hover {
            transform: translateY(-20px) scale(1.05);
        }

        .book-spine.wobble {
            animation: wobble 1s infinite ease-in-out alternate;
        }

        @keyframes wobble {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .spine-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: rgba(255,255,255,0.9);
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            transform: rotate(180deg);
            pointer-events: none;
            max-height: 85%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .desk-texture {
            background-color: #4e342e;
            background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        }

        .perspective-2000 {
            perspective: 2000px;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        /* Centrado dinámico al abrir */
        .book-inner {
            transform: translateX(0);
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .is-open .book-inner {
            transform: translateX(25%);
        }
        /* En móvil el libro ocupa casi todo el ancho: cualquier desplazamiento
           lo saca de la pantalla y corta el texto de la página. */
        @media (max-width: 768px) {
            .is-open .book-inner {
                transform: translateX(0);
            }
        }

        .cover-front-3d {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            z-index: 30;
            transform: translateZ(5px);
        }

        .is-open .cover-front-3d {
            transform: rotateY(-170deg) translateZ(5px);
        }

        .cover-face-front, .cover-face-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 2px 18px 18px 2px;
        }

        .cover-face-front {
            box-shadow: inset 5px 0 20px rgba(0,0,0,0.6), 5px 5px 20px rgba(0,0,0,0.5);
            /* Gradiente base, el color se inyecta por JS */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
        }

        .cover-face-back {
            transform: rotateY(180deg);
            background-color: #d4c5a9;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 20px);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
            border-radius: 18px 2px 2px 18px;
        }

        #book-back-cover {
            transform: translateZ(-5px);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7);
        }

        .pages-3d {
            position: absolute;
            top: 8px; left: 12px;
            width: calc(100% - 20px);
            height: calc(100% - 16px);
            background: var(--paper-color);
            border-radius: 2px 12px 12px 2px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
            border-right: 5px solid #e5d8b8;
            border-bottom: 5px solid #e5d8b8;
            z-index: 10;
            transform: translateZ(0);
        }

        .page-content-scroll {
            width: 100%; height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 25px;
            position: relative;
        }

        /* Líneas estilo libreta */
        .custom-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--paper-lines) 31px, var(--paper-lines) 32px);
            line-height: 32px;
            background-attachment: local;
        }

        /* Estilo Polaroid */
        .polaroid {
            background: #fff;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #eee;
            position: relative;
        }
        .polaroid::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.4);
            pointer-events: none;
        }

        /* Punto de libro */
        .bookmark {
            position: absolute;
            top: -15px; 
            right: 30px;
            width: 35px;
            height: 70px;
            background-color: #2c3e50;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.4s;
            cursor: pointer;
            z-index: 50;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        }
        .bookmark.active {
            top: 0px; 
            background-color: #e74c3c; 
        }

        /* Botón de grabar animado */
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- Selector de idioma --- */
        .flag-svg {
            width: 28px;
            height: 19px;
            display: block;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            background: #1d1511;
            border: 1px solid rgba(253, 230, 138, 0.2);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.7);
            z-index: 60;
            min-width: 200px;
        }
        .lang-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 9px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #fde68a;
            font-family: sans-serif;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
        }
        .lang-item:hover { background: rgba(255,255,255,0.09); }
        .lang-item.selected { background: rgba(255,255,255,0.14); font-weight: 700; color: #fff; }

        /* --- Pasar página arrastrando --- */
        /* pan-y: el navegador se queda el scroll vertical y a nosotros nos llegan
           los gestos horizontales sin que los consuma. */
        #page-scroller { touch-action: pan-y; }

        .pages-3d { perspective: 1600px; }

        .flip-under {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--paper-color);
            border-radius: 2px 12px 12px 2px;
            overflow: hidden;
            z-index: 12;
            display: none;
        }
        .flip-sheet {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            z-index: 14;
            display: none;
        }
        .flip-under.active, .flip-sheet.active { display: block; }
        .flip-under, .flip-sheet { pointer-events: none; }
        .flip-sheet.animating { transition: transform 0.5s cubic-bezier(0.25, 0.6, 0.3, 1); }

        .flip-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background: var(--paper-color);
            overflow: hidden;
            border-radius: 2px 12px 12px 2px;
            box-shadow: 0 0 25px rgba(0,0,0,0.35);
        }
        .flip-face-back {
            transform: rotateY(180deg);
            border-radius: 12px 2px 2px 12px;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(0,0,0,0.02) 12px, rgba(0,0,0,0.02) 24px);
        }
        /* Sombra del pliegue: se oscurece a medida que gira la hoja */
        .flip-shade {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0) 50%);
            opacity: 0;
        }
        .flip-replica {
            width: 100%;
            height: 100%;
            padding: 40px 25px;
            overflow: hidden;
        }

        /* Tira de polaroids (varias fotos por página) */
        .polaroid-thumb { width: 150px; }
        @media (min-width: 640px) { .polaroid-thumb { width: 175px; } }

        /* Pulsación larga sobre un tomo */
        .book-spine {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, filter 0.3s;
        }
        .book-spine.press-hold {
            transform: translateY(-16px) scale(1.07);
            filter: brightness(1.25);
            box-shadow: 0 0 0 3px rgba(253, 230, 138, 0.6), 10px 14px 22px rgba(0,0,0,0.7);
        }

        /* --- Exportación a PDF --- */
        /* El documento se maqueta en #print-root y solo existe al imprimir. */
        #print-root { display: none; }

        @media print {
            @page {
                size: A4;
                margin: 18mm 16mm 20mm 16mm;
            }

            html, body {
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }

            #library-view, #reader-view, #modal-overlay { display: none !important; }

            #print-root {
                display: block !important;
                font-family: 'Georgia', serif;
                color: #1a1a1a;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-cover {
                min-height: 210mm;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .pdf-cover-band {
                width: 62mm;
                height: 3.5mm;
                border-radius: 2mm;
                margin-bottom: 16mm;
            }
            .pdf-kicker {
                font-size: 8.5pt;
                letter-spacing: 0.38em;
                text-transform: uppercase;
                color: #7a7a7a;
                margin: 0 0 9mm;
            }
            .pdf-cover h1 {
                font-size: 34pt;
                font-weight: 700;
                line-height: 1.15;
                margin: 0;
                max-width: 130mm;
            }
            .pdf-rule {
                width: 26mm;
                height: 1px;
                background: #c9c9c9;
                margin: 10mm auto;
            }
            .pdf-meta {
                font-size: 10.5pt;
                color: #5f5f5f;
                font-style: italic;
                margin: 0 0 2mm;
            }

            /* Una entrada por hoja: la portada no lleva salto propio, lo pone cada entrada */
            .pdf-entry {
                break-before: page;
                page-break-before: always;
            }
            .pdf-runhead {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10mm;
                font-size: 7.5pt;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: #8f8f8f;
                border-bottom: 1px solid #dcdcdc;
                padding-bottom: 3mm;
                margin-bottom: 9mm;
            }
            .pdf-runhead span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .pdf-runhead span:last-child { white-space: nowrap; }

            .pdf-entry h2 {
                font-size: 21pt;
                font-weight: 700;
                line-height: 1.2;
                margin: 0 0 4mm;
            }
            .pdf-dateline {
                font-size: 9.5pt;
                color: #6b6b6b;
                font-style: italic;
                margin: 0 0 8mm;
            }

            .pdf-photos {
                display: grid;
                gap: 5mm;
                margin: 0 0 8mm;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .pdf-photos.one { grid-template-columns: 1fr; }
            .pdf-photos.many { grid-template-columns: 1fr 1fr; }
            .pdf-photos figure {
                margin: 0;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .pdf-photos img {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid #e2e2e2;
            }

            .pdf-text {
                font-size: 11.5pt;
                line-height: 1.75;
                white-space: pre-wrap;
                text-align: justify;
                hyphens: auto;
                margin: 0;
                orphans: 3;
                widows: 3;
            }
            .pdf-note {
                margin: 8mm 0 0;
                font-size: 9pt;
                color: #8f8f8f;
                font-style: italic;
            }
            .pdf-empty {
                font-size: 10pt;
                color: #a5a5a5;
                font-style: italic;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="library-view" class="absolute inset-0 bg-wood z-10 overflow-y-auto no-scrollbar pb-32 transition-opacity duration-500">
        <div class="sticky top-0 bg-black bg-opacity-50 backdrop-blur-sm p-6 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center gap-3 min-w-0">
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-serif text-amber-100 drop-shadow-md truncate" data-i18n="appTitle">Els meus diaris</h1>
                <div class="relative shrink-0">
                    <button id="lang-btn" onclick="toggleLangMenu(event)" class="flex items-center gap-1 p-1 rounded-lg hover:bg-white/10 transition" aria-haspopup="true" aria-expanded="false">
                        <span id="lang-flag"></span>
                        <svg class="w-3 h-3 text-amber-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="lang-menu" class="lang-menu hidden"></div>
                </div>
            </div>
            <div class="flex items-center space-x-4 sm:space-x-5 text-lg sm:text-base shrink-0">
                <button onclick="exportData()" class="text-amber-200 hover:text-white transition font-medium whitespace-nowrap" data-i18n-title="exportTitle">
                    ⤓<span class="hidden sm:inline ml-1" data-i18n="export">Exportar</span>
                </button>
                <label class="text-amber-200 hover:text-white transition font-medium cursor-pointer whitespace-nowrap" data-i18n-title="importTitle">
                    ⤒<span class="hidden sm:inline ml-1" data-i18n="import">Importar</span>
                    <input type="file" accept="application/json,.json" hidden onchange="handleImportFile(event)">
                </label>
                <button onclick="toggleEditMode()" id="edit-btn" class="text-amber-200 hover:text-white transition font-medium whitespace-nowrap">
                    ✎<span class="hidden sm:inline ml-1" data-i18n="edit">Editar</span>
                </button>
            </div>
        </div>
        
        <div id="library-shelves" class="shelf-container mt-4">
            <!-- Los tomos se inyectarán aquí -->
        </div>

        <button onclick="createNewJournal()" class="fixed bottom-8 right-8 bg-gradient-to-r from-amber-600 to-amber-700 text-white rounded-full p-4 shadow-2xl hover:scale-110 transition flex items-center justify-center z-20 border-2 border-amber-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        </button>
    </div>

    <div id="reader-view" class="absolute inset-0 desk-texture z-20 hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-500">
        
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-50 pointer-events-none">
            <button onclick="closeBook()" class="pointer-events-auto px-5 py-2 bg-black bg-opacity-60 text-amber-100 border border-amber-900 rounded-full hover:bg-opacity-80 transition flex items-center shadow-xl">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span data-i18n="closeJournal">Tancar diari</span>
            </button>
            <button onclick="showBookmarks()" class="pointer-events-auto px-4 py-2 bg-black bg-opacity-60 text-amber-100 border border-amber-900 rounded-full hover:bg-opacity-80 transition flex items-center shadow-xl" data-i18n-title="bookmarksTitle">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3a2 2 0 00-2 2v16l9-4 9 4V5a2 2 0 00-2-2H5z"></path></svg>
            </button>
        </div>
        
        <div class="book-wrapper w-[92vw] max-w-2xl h-[85vh] max-h-[850px] perspective-2000 relative">
            <div class="book-inner w-full h-full relative preserve-3d" id="book-inner">
                
                <!-- Tapa Trasera -->
                <div class="absolute top-0 left-0 w-full h-full rounded-r-2xl rounded-l-sm z-0" id="book-back-cover"></div>

                <!-- Contenedor de Páginas (El interior del libro) -->
                <div class="pages-3d">
                    <div class="page-content-scroll relative" id="page-scroller">
                        
                        <div id="bookmark-ribbon" onclick="toggleBookmark()" class="bookmark" data-i18n-title="bookmarkRibbon"></div>

                        <input type="text" id="page-title" class="w-full bg-transparent text-3xl md:text-4xl font-serif text-gray-800 border-none outline-none mb-8 placeholder-gray-400 text-center font-bold" data-i18n-placeholder="pageTitlePlaceholder" oninput="debounceSave()">
                        
                        <!-- Tira de polaroids: se rellena por JS desde currentPage.photos -->
                        <div id="photos-strip" class="flex flex-wrap justify-center items-start gap-6 mb-6"></div>

                        <div class="flex justify-center gap-4 mb-8 font-sans">
                            <label class="cursor-pointer border-2 border-dashed border-gray-400 rounded-xl px-6 py-5 text-gray-500 hover:bg-black hover:bg-opacity-5 transition flex flex-col items-center group">
                                <span class="text-4xl mb-2 transform group-hover:scale-110 transition drop-shadow-sm">📸</span>
                                <span class="font-medium text-sm" data-i18n="camera">Càmera</span>
                                <!-- capture: abre directamente la cámara en móviles -->
                                <input type="file" accept="image/*" capture="environment" hidden onchange="handlePhotoCapture(event)">
                            </label>
                            <label class="cursor-pointer border-2 border-dashed border-gray-400 rounded-xl px-6 py-5 text-gray-500 hover:bg-black hover:bg-opacity-5 transition flex flex-col items-center group">
                                <span class="text-4xl mb-2 transform group-hover:scale-110 transition drop-shadow-sm">🖼️</span>
                                <span class="font-medium text-sm" data-i18n="gallery">Galeria</span>
                                <!-- Sin capture: deja elegir fotos ya hechas, y varias a la vez -->
                                <input type="file" accept="image/*" multiple hidden onchange="handlePhotoCapture(event)">
                            </label>
                        </div>

                        <div id="metadata-container" class="hidden w-full max-w-sm mx-auto mb-8 bg-black bg-opacity-[0.03] rounded-lg p-3 flex flex-col items-center justify-center space-y-2 text-sm text-gray-700 font-sans border border-gray-300 shadow-inner">
                            <div class="flex items-center space-x-6 font-medium">
                                <span class="flex items-center"><svg class="w-4 h-4 mr-1 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> <span id="meta-date">--/--/----</span></span>
                                <span class="flex items-center"><svg class="w-4 h-4 mr-1 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span id="meta-time">--:--</span></span>
                            </div>
                            <div class="w-3/4 h-px bg-gray-300 my-1"></div>
                            <div class="flex items-center text-blue-700 cursor-pointer hover:text-blue-900 transition font-medium" onclick="openLocation()">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span id="meta-location" class="underline">Buscando ubicación...</span>
                            </div>
                        </div>

                        <div class="w-full max-w-sm mx-auto mb-8">
                            <button id="record-btn" onclick="toggleRecording()" class="w-full bg-gradient-to-r from-red-500 to-red-600 text-white py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition flex justify-center items-center space-x-2 font-sans font-medium">

        }

        // --- IndexedDB Wrapper robusto ---
        const DB_NAME = 'TravelJournalDB_v2';
        const STORE_NAME = 'journals';

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, {keyPath: 'id'});
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getJournals() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveJournalDB(journal) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(journal);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deleteJournalDB(id) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Migración: hasta ahora cada página tenía una sola foto en `photo`.
        // Ahora son varias en `photos[]`; los diarios antiguos se convierten al vuelo.
        function normalizePage(p) {
            if(!Array.isArray(p.photos)) p.photos = p.photo ? [p.photo] : [];
            delete p.photo;
            if(!('locationName' in p)) p.locationName = null;
            if(!('bookmarked' in p)) p.bookmarked = false;
            return p;
        }

        function normalizeJournal(j) {
            j.pages = Array.isArray(j.pages) ? j.pages.map(normalizePage) : [];
            if(j.pages.length === 0) j.pages = [createEmptyPage()];
            return j;
        }

        // --- Copias de seguridad ---
        // IndexedDB vive solo en este navegador y puede purgarse. Exportar/importar
        // es la única forma de no perder los diarios al cambiar de móvil.
        function exportData() {
            if(journals.length === 0) {
                Modal.showMsg(t('nothingToExportTitle'), t('nothingToExportMsg'));
                return;
            }
            const payload = {
                format: 'diario-viajes',
                version: 1,
                exportedAt: new Date().toISOString(),
                journals: journals
            };
            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diarios-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            event.target.value = ''; // Permitir reimportar el mismo archivo
            if(!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                let incoming;
                try {
                    const data = JSON.parse(e.target.result);
                    incoming = Array.isArray(data) ? data : data.journals;
                } catch(err) {
                    incoming = null;
                }

                const valid = Array.isArray(incoming)
                    ? incoming.filter(j => j && typeof j.title === 'string' && Array.isArray(j.pages))
                    : [];

                if(valid.length === 0) {
                    Modal.showMsg(t('importErrorTitle'), t('importErrorMsg'));
                    return;
                }

                try {
                    for(const j of valid) {
                        // Los diarios se añaden, nunca sobrescriben: id nuevo si ya existe
                        const collides = !j.id || journals.some(x => x.id === j.id);
                        journals.push(normalizeJournal({
                            id: collides ? 'journal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) : j.id,
                            title: j.title,
                            color: j.color || bookColors[Math.floor(Math.random() * bookColors.length)],
                            pages: j.pages
                        }));
                        await saveJournalDB(journals[journals.length - 1]);
                    }
                    renderLibrary();
                    Modal.showMsg(t('importOkTitle'), t('importOkMsg', { n: valid.length }));
                } catch(err) {
                    console.error(err);
                    renderLibrary();
                    Modal.showMsg(t('importSaveErrorTitle'), t('importSaveErrorMsg'));
                }
            };
            reader.readAsText(file);
        }

        // --- Pulsación larga ---
        const LONG_PRESS_MS = 550;

        function attachLongPress(el, accion) {
            let timer = null;
            let inicio = null;
            let disparado = false;

            const cancelar = () => {
                clearTimeout(timer);
                timer = null;
                el.classList.remove('press-hold');
            };

            el.addEventListener('pointerdown', (e) => {
                if(e.pointerType === 'mouse' && e.button !== 0) return;
                disparado = false;
                inicio = { x: e.clientX, y: e.clientY };
                el.classList.add('press-hold');
                timer = setTimeout(() => {
                    disparado = true;
                    cancelar();
                    if(navigator.vibrate) navigator.vibrate(18);
                    accion();
                }, LONG_PRESS_MS);
            });

            el.addEventListener('pointermove', (e) => {
                if(!inicio || !timer) return;
                // Si el dedo se mueve, ya no es una pulsación: es un arrastre
                if(Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 10) cancelar();
            });

            el.addEventListener('pointerup', cancelar);
            el.addEventListener('pointercancel', cancelar);
            el.addEventListener('pointerleave', cancelar);

            // Tras una pulsación larga llega un click: hay que impedir que abra el diario
            el.addEventListener('click', (e) => {
                if(disparado) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    disparado = false;
                }
            }, true);

            // En móvil, mantener pulsado abre el menú del navegador
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        // --- Exportar un diario a PDF ---
        // Se maqueta un documento aparte y se deja imprimir al navegador: el texto
        // sale vectorial y seleccionable, y no hace falta ninguna librería.
        const TITULO_ORIGINAL = document.title;

        function pdfDateRange(journal) {
            const fechas = journal.pages.map(p => p.date).filter(Boolean);
            if(fechas.length === 0) return '';
            const primera = fechas[0];
            const ultima = fechas[fechas.length - 1];
            return primera === ultima ? primera : `${primera} — ${ultima}`;
        }

        function buildPrintDocument(journal) {
            const total = journal.pages.length;

            const entradas = journal.pages.map((page, i) => {
                const fotos = page.photos || [];
                const bloqueFotos = fotos.length
                    ? `<div class="pdf-photos ${fotos.length === 1 ? 'one' : 'many'}">${
                        fotos.map(src => `<figure><img src="${src}" alt=""></figure>`).join('')
                      }</div>`
                    : '';

                const linea = [page.date, page.time, page.locationName].filter(Boolean).join(' · ');
                const texto = (page.text || '').trim();
                const sinNada = !texto && fotos.length === 0;

                return `
                    <section class="pdf-entry">
                        <div class="pdf-runhead">
                            <span>${escapeHtml(journal.title)}</span>
                            <span>${escapeHtml(t('pdfPageOf', { n: i + 1, total }))}</span>
                        </div>
                        ${page.title ? `<h2>${escapeHtml(page.title)}</h2>` : ''}
                        ${linea ? `<p class="pdf-dateline">${escapeHtml(linea)}</p>` : ''}
                        ${bloqueFotos}
                        ${texto ? `<p class="pdf-text">${escapeHtml(texto)}</p>` : ''}
                        ${sinNada ? `<p class="pdf-empty">—</p>` : ''}
                        ${page.audio ? `<p class="pdf-note">${escapeHtml(t('pdfAudioNote'))}</p>` : ''}
                    </section>`;
            }).join('');

            const rango = pdfDateRange(journal);
            const recuento = total === 1 ? t('pdfPagesCount1') : t('pdfPagesCount', { n: total });

            document.getElementById('print-root').innerHTML = `
                <div class="pdf-cover">
                    <div class="pdf-cover-band" style="background:${journal.color}"></div>
                    <p class="pdf-kicker">${escapeHtml(t('coverBadge'))}</p>
                    <h1>${escapeHtml(journal.title)}</h1>
                    <div class="pdf-rule"></div>
                    ${rango ? `<p class="pdf-meta">${escapeHtml(rango)}</p>` : ''}
                    <p class="pdf-meta">${escapeHtml(recuento)}</p>
                </div>
                ${entradas}`;
        }

        async function exportJournalPdf(id) {
            const journal = journals.find(j => j.id === id);
            if(!journal) return;

            // Si es el diario abierto, volcar antes lo que esté sin guardar
            if(currentJournal && currentJournal.id === id) await flushSave();

            buildPrintDocument(journal);
            // El navegador usa el título del documento como nombre del PDF
            document.title = journal.title;

            const limpiar = () => {
                document.getElementById('print-root').innerHTML = '';
                document.title = TITULO_ORIGINAL;
            };
            window.addEventListener('afterprint', limpiar, { once: true });

            window.print();
        }

        function openJournal(journal) {
            currentJournal = journal;
            currentPageIndex = 0;
            
            // Configurar aspecto del libro
            document.getElementById('cover-title').textContent = journal.title;
            document.getElementById('book-front-face').style.backgroundColor = journal.color;
            document.getElementById('book-back-cover').style.backgroundColor = journal.color;
            
            // Transición de vistas
            document.getElementById('library-view').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('library-view').classList.add('hidden');
                
                const reader = document.getElementById('reader-view');
                reader.classList.remove('hidden');
                // Forzar reflow
                void reader.offsetWidth;
                reader.classList.remove('opacity-0');
                
                // Animar apertura del libro
                setTimeout(() => {
                    document.querySelector('.book-wrapper').classList.add('is-open');
                    renderCurrentPage();
                }, 300);

            }, 500);
        }

        function closeBook() {
            if(isRecording) toggleRecording(); // Parar grabación si la hay
            flushSave(); // No dejar cambios recientes sin guardar al salir

            document.querySelector('.book-wrapper').classList.remove('is-open');
            
            setTimeout(() => {
                const reader = document.getElementById('reader-view');
                reader.classList.add('opacity-0');
                
                setTimeout(() => {
                    reader.classList.add('hidden');
                    const library = document.getElementById('library-view');
                    library.classList.remove('hidden');
                    void library.offsetWidth;
                    library.classList.remove('opacity-0');
                    currentJournal = null;
                }, 500);
            }, 800); // Esperar a que se cierre la tapa
        }

        function renderCurrentPage() {
            if (!currentJournal || currentJournal.pages.length === 0) return;
            currentPage = currentJournal.pages[currentPageIndex];
            
            // Textos
            document.getElementById('page-title').value = currentPage.title || '';
            document.getElementById('page-text').value = currentPage.text || '';
            
            // Fotos
            renderPhotosStrip();

            // Metadatos (Geoloc, fecha)
            if (currentPage.date) {
                document.getElementById('meta-date').textContent = currentPage.date;
                document.getElementById('meta-time').textContent = currentPage.time;
                showLocation(currentPage);
                document.getElementById('metadata-container').classList.remove('hidden');
            } else {
                document.getElementById('metadata-container').classList.add('hidden');
            }
            
            // Audio
            const audioEl = document.getElementById('page-audio');
            if (currentPage.audio) {
                audioEl.src = currentPage.audio;
                document.getElementById('audio-container').classList.remove('hidden');
                document.getElementById('record-btn').classList.add('hidden');
            } else {
                audioEl.src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                // Sin esto el botón podría quedarse en "Procesando..." de la página anterior
                if(!isRecording) setRecordButton('listo');
            }
            
            // Punto de libro
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            
            // Paginación
            document.getElementById('page-indicator').textContent = `${currentPageIndex + 1} / ${currentJournal.pages.length}`;
            
            // Reset scroll
            document.getElementById('page-scroller').scrollTop = 0;
        }

        let saveTimeout;
        function debounceSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCurrentState, 800);
        }

        // Vuelca al disco lo que haya pendiente ANTES de cambiar de página.
        // Sin esto, el guardado retrasado se dispararía leyendo el DOM ya repintado
        // y escribiría el contenido de la página nueva encima, perdiendo lo escrito.
        function flushSave() {
            clearTimeout(saveTimeout);
            return saveCurrentState();
        }

        // Un guardado que falla (cupo de IndexedDB lleno por fotos y audios) no puede
        // pasar desapercibido: el usuario seguiría escribiendo creyendo que se guarda.
        let saveErrorNotified = false;

        async function saveCurrentState() {
            if(!currentJournal || !currentPage) return;

            currentPage.title = document.getElementById('page-title').value;
            currentPage.text = document.getElementById('page-text').value;

            currentJournal.pages[currentPageIndex] = currentPage;

            try {
                await saveJournalDB(currentJournal);
                saveErrorNotified = false;
            } catch(err) {
                console.error('Fallo al guardar el diario', err);
                if(!saveErrorNotified) {
                    saveErrorNotified = true;
                    Modal.showMsg(t('saveErrorTitle'), t('saveErrorMsg'));
                }
                return;
            }

            // Actualizar array en memoria por si acaso
            const idx = journals.findIndex(j => j.id === currentJournal.id);
            if(idx !== -1) journals[idx] = currentJournal;
        }

        // Cambio de página sin animación: el punto por el que pasan todos los caminos
        async function goToPage(index) {
            if(!currentJournal) return;
            if(index < 0 || index >= currentJournal.pages.length) return;
            if(isRecording) toggleRecording(); // No seguir grabando en otra página
            await flushSave();
            currentPageIndex = index;
            renderCurrentPage();
        }

        function prevPage() { animateFlip(-1); }
        function nextPage() { animateFlip(1); }

        async function addNewPage() {
            if(isRecording) toggleRecording();
            await flushSave();
            currentJournal.pages.push(createEmptyPage());
            currentPageIndex = currentJournal.pages.length - 1;
            renderCurrentPage();
            saveCurrentState();
        }

        function deleteCurrentPage() {
            if(!currentJournal || !currentPage) return;
            Modal.showMsg(t('deletePageTitle'), t('deletePageMsg'), true, async () => {
                if(isRecording) toggleRecording();
                // Lo que hubiera pendiente de guardar es de la página que se va
                clearTimeout(saveTimeout);

                const idx = currentPageIndex;
                currentJournal.pages.splice(idx, 1);
                if(currentJournal.pages.length === 0) currentJournal.pages.push(createEmptyPage());
                currentPageIndex = Math.min(idx, currentJournal.pages.length - 1);

                renderCurrentPage();
                await saveCurrentState();
            });
        }

        function showBookmarks() {
            if(!currentJournal) return;
            const items = [];
            currentJournal.pages.forEach((p, i) => {
                if(!p.bookmarked) return;
                items.push({
                    label: (p.title || '').trim() || t('untitled'),
                    sub: t('pageN', { n: i + 1 }) + (p.date ? ' · ' + p.date : ''),
                    onPick: () => goToPage(i)
                });
            });
            Modal.showList(t('bookmarksListTitle'), items, t('noBookmarks'));
        }

        // --- Pasar página arrastrando ---
        // La hoja que gira es una réplica visual estática: el textarea, el audio y los
        // botones no se pueden rotar en 3D de forma fiable, así que durante el gesto se
        // muestra una copia sin controles y al terminar vuelve el contenido real.
        let isFlipping = false;
        let flipState = null;

        function replicaHtml(page) {
            if(!page) return '';
            const fotos = (page.photos || []).slice(0, 3).map((src, i) =>
                `<div class="polaroid polaroid-thumb" style="transform: rotate(${photoTilt(i)}deg)"><img class="w-full h-auto object-cover rounded-sm" src="${src}" alt=""></div>`
            ).join('');
            const meta = page.date
                ? `<div class="w-full max-w-sm mx-auto mb-6 bg-black bg-opacity-[0.03] rounded-lg p-3 text-center text-sm text-gray-700 font-sans border border-gray-300">
                       ${escapeHtml(page.date)} · ${escapeHtml(page.time || '')}<br>
                       <span class="text-blue-700 underline">${escapeHtml(page.locationName || '')}</span>
                   </div>`
                : '';
            const audio = page.audio
                ? `<div class="w-full max-w-sm mx-auto mb-6 bg-gray-200 rounded-xl p-4 border border-gray-300 text-center text-gray-500 font-sans text-sm">▶ ▬▬▬▬▬▬▬▬▬▬</div>`
                : '';
            return `
                <h2 class="text-3xl md:text-4xl font-serif text-gray-800 mb-8 text-center font-bold">${escapeHtml(page.title || '')}</h2>
                <div class="flex flex-wrap justify-center items-start gap-6 mb-6">${fotos}</div>
                ${meta}${audio}
                <div class="font-serif text-gray-800 text-lg custom-lines whitespace-pre-wrap p-1">${escapeHtml(page.text || '')}</div>
            `;
        }

        function flipEls() {
            return {
                sheet: document.getElementById('flip-sheet'),
                under: document.getElementById('flip-under'),
                sheetContent: document.getElementById('flip-sheet-content'),
                underContent: document.getElementById('flip-under-content'),
                shadeFront: document.getElementById('flip-shade-front'),
                shadeBack: document.getElementById('flip-shade-back')
            };
        }

        // dir: 1 hacia adelante, -1 hacia atrás. Devuelve false si no hay a dónde ir.
        function beginFlip(dir) {
            if(!currentJournal || isFlipping) return false;
            const destino = currentPageIndex + dir;
            if(destino < 0 || destino >= currentJournal.pages.length) return false;

            // El objeto de la página se actualiza en el acto, así que la réplica
            // sale con lo último escrito aunque el guardado aún esté pendiente.
            flushSave();

            const els = flipEls();
            if(dir === 1) {
                // Se va la actual y debajo espera la siguiente
                els.sheetContent.innerHTML = replicaHtml(currentJournal.pages[currentPageIndex]);
                els.underContent.innerHTML = replicaHtml(currentJournal.pages[destino]);
            } else {
                // Entra la anterior por la izquierda, sobre la actual
                els.sheetContent.innerHTML = replicaHtml(currentJournal.pages[destino]);
                els.underContent.innerHTML = replicaHtml(currentJournal.pages[currentPageIndex]);
            }
            els.under.classList.add('active');
            els.sheet.classList.add('active');

            flipState = { dir, destino, progress: 0 };
            isFlipping = true;
            setFlipProgress(0);
            return true;
        }

        function setFlipProgress(p) {
            if(!flipState) return;
            flipState.progress = p;
            const els = flipEls();
            // Adelante: de 0° a -180°. Atrás: llega desde -180° hasta 0°.
            const angle = flipState.dir === 1 ? -180 * p : -180 * (1 - p);
            els.sheet.style.transform = `rotateY(${angle}deg)`;
            // La sombra es máxima con la hoja de canto y se va con ella plana
            const sombra = Math.sin(Math.abs(angle) * Math.PI / 180);
            els.shadeFront.style.opacity = sombra * 0.55;
            els.shadeBack.style.opacity = sombra * 0.35;
        }

        function endFlip(commit) {
            if(!flipState) return;
            const els = flipEls();
            const st = flipState;

            els.sheet.classList.add('animating');
            setFlipProgress(commit ? 1 : 0);

            setTimeout(async () => {
                els.sheet.classList.remove('animating');
                if(commit) await goToPage(st.destino);
                els.sheet.classList.remove('active');
                els.under.classList.remove('active');
                els.sheet.style.transform = '';
                flipState = null;
                isFlipping = false;
            }, 520);
        }

        // Paso de página con los botones: mismo pliegue, disparado a mano
        function animateFlip(dir) {
            if(!beginFlip(dir)) return;
            void document.getElementById('flip-sheet').offsetWidth; // reflow: la transición parte del ángulo inicial
            endFlip(true);
        }

        function initFlipGestures() {
            const scroller = document.getElementById('page-scroller');
            let start = null;

            scroller.addEventListener('pointerdown', (e) => {
                if(isFlipping || !currentJournal) return;
                if(e.pointerType === 'mouse' && e.button !== 0) return;
                // No robarle el gesto a los controles ni a la selección de texto
                if(e.target.closest('input, textarea, button, label, audio, a, .polaroid, #bookmark-ribbon')) return;
                start = { x: e.clientX, y: e.clientY, id: e.pointerId, decidido: false };
            });

            scroller.addEventListener('pointermove', (e) => {
                if(!start || e.pointerId !== start.id) return;
                const dx = e.clientX - start.x;
                const dy = e.clientY - start.y;

                if(!start.decidido) {
                    // Vertical: es scroll, soltamos el gesto
                    if(Math.abs(dy) > 12 && Math.abs(dy) >= Math.abs(dx)) { start = null; return; }
                    // Aún no está claro que sea horizontal: esperamos
                    if(Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                    if(!beginFlip(dx < 0 ? 1 : -1)) { start = null; return; }
                    start.decidido = true;
                    // Puede fallar si el puntero ya se ha soltado: no es motivo para abortar
                    try { scroller.setPointerCapture(e.pointerId); } catch(err) { /* seguimos sin captura */ }
                }

                const ancho = scroller.clientWidth || 1;
                const recorrido = flipState.dir === 1 ? -dx : dx;
                setFlipProgress(Math.max(0, Math.min(1, recorrido / ancho)));
            });

            const soltar = (e) => {
                if(!start || (e && e.pointerId !== start.id)) return;
                const decidido = start.decidido;
                start = null;
                if(decidido && flipState) endFlip(flipState.progress >= 0.35);
            };
            scroller.addEventListener('pointerup', soltar);
            scroller.addEventListener('pointercancel', soltar);
        }

        function toggleBookmark() {
            if(!currentPage) return;
            currentPage.bookmarked = !currentPage.bookmarked;
            if (currentPage.bookmarked) {
                document.getElementById('bookmark-ribbon').classList.add('active');
            } else {
                document.getElementById('bookmark-ribbon').classList.remove('active');
            }
            saveCurrentState();
        }

        // Cada polaroid se inclina un poco, siempre igual para la misma posición,
        // para que no bailen al repintar la página.
        function photoTilt(i) {
            return [-3, 2, -1.5, 3, -2.5, 1][i % 6];
        }

        function renderPhotosStrip() {
            const strip = document.getElementById('photos-strip');
            const fotos = (currentPage && currentPage.photos) || [];
            strip.innerHTML = fotos.map((src, i) => `
                <div class="polaroid polaroid-thumb relative transition duration-300 hover:rotate-0" style="transform: rotate(${photoTilt(i)}deg)">
                    <button data-idx="${i}" class="quitar-foto absolute -top-3 -right-3 bg-gray-800 text-white rounded-full w-7 h-7 flex items-center justify-center shadow-lg hover:bg-red-600 transition z-10 font-sans border-2 border-white">✕</button>
                    <img class="w-full h-auto object-cover rounded-sm" src="${src}" alt="">
                </div>
            `).join('');
            strip.querySelectorAll('.quitar-foto').forEach(b => {
                b.onclick = () => removePhoto(Number(b.dataset.idx));
            });
        }

        function handlePhotoCapture(event) {
            const files = Array.from(event.target.files || []);
            event.target.value = ''; // Permitir volver a elegir la misma foto
            if(files.length === 0 || !currentPage) return;

            const targetPage = currentPage;
            const eraLaPrimera = targetPage.photos.length === 0;

            // Se procesan en serie para que el orden final sea el de selección
            const procesar = (i) => {
                if(i >= files.length) {
                    if(currentPage === targetPage) renderPhotosStrip();
                    // Con la primera foto de la página capturamos fecha, hora y lugar
                    if(eraLaPrimera) captureMetadata();
                    else saveCurrentState();
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // Redimensionar para no saturar IndexedDB
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        targetPage.photos.push(canvas.toDataURL('image/jpeg', 0.7));
                        procesar(i + 1);
                    };
                    img.onerror = () => procesar(i + 1);
                    img.src = e.target.result;
                };
                reader.onerror = () => procesar(i + 1);
                reader.readAsDataURL(files[i]);
            };
            procesar(0);
        }

        function removePhoto(index) {
            Modal.showMsg(t('deletePhotoTitle'), t('deletePhotoMsg'), true, () => {
                if(!currentPage) return;
                currentPage.photos.splice(index, 1);
                // Los metadatos solo se borran al quitar la última foto de la página
                if(currentPage.photos.length === 0) {
                    currentPage.date = null;
                    currentPage.time = null;
                    currentPage.lat = null;
                    currentPage.lng = null;
                    currentPage.locationName = null;
                    document.getElementById('metadata-container').classList.add('hidden');
                }
                renderPhotosStrip();
                saveCurrentState();
            });
        }

        function captureMetadata() {
            // El GPS tarda: al volver puede que ya estemos en otra página, así que
            // los datos se escriben en la página donde se tomó la foto, no en la actual.
            const targetPage = currentPage;
            const now = new Date();
            targetPage.date = now.toLocaleDateString();
            targetPage.time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            document.getElementById('meta-date').textContent = targetPage.date;
            document.getElementById('meta-time').textContent = targetPage.time;
            document.getElementById('meta-location').textContent = t('searchingLocation');
            document.getElementById('metadata-container').classList.remove('hidden');
            saveCurrentState();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        targetPage.lat = position.coords.latitude;
                        targetPage.lng = position.coords.longitude;
                        targetPage.locationName = null;
                        saveCurrentState();
                        if(currentPage === targetPage) showLocation(targetPage);
                    },
                    (error) => {
                        if(currentPage === targetPage) {
                            document.getElementById('meta-location').textContent = t('locationUnavailable');
                        }
                        console.warn("Geolocalización fallida", error);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        // Devuelve el nombre del sitio, o null si no se ha podido averiguar.
        // Null en vez de las coordenadas para no cachear un fallo de red como si
        // fuese el nombre definitivo del lugar: así se reintenta más adelante.
        async function reverseGeocode(lat, lng) {
            try {
                // API Gratuita de OpenStreetMap para obtener el nombre de la ciudad
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                const a = data.address || {};
                return a.city || a.town || a.village || a.county || null;
            } catch(e) {
                return null;
            }
        }

        function coordsLabel(lat, lng) {
            return `Lat: ${lat.toFixed(2)}, Lng: ${lng.toFixed(2)}`;
        }

        // Pinta la ubicación de una página concreta. El nombre se guarda en la propia
        // página: sin caché se pedía a Nominatim en cada render (su límite es 1 petición
        // por segundo) y, al pasar páginas rápido, la respuesta de una página anterior
        // acababa pintada sobre la que se estaba viendo.
        function showLocation(page) {
            const el = document.getElementById('meta-location');

            if(!page.lat) {
                el.textContent = t('unknownLocation');
                return;
            }
            if(page.locationName) {
                el.textContent = page.locationName;
                return;
            }

            el.textContent = t('searchingLocation');
            reverseGeocode(page.lat, page.lng).then(name => {
                if(name) {
                    page.locationName = name;
                    saveCurrentState();
                }
                if(currentPage === page) {
                    el.textContent = name || coordsLabel(page.lat, page.lng);
                }
            });
        }

        function openLocation() {
            if(currentPage && currentPage.lat && currentPage.lng) {
                window.open(`https://www.google.com/maps?q=${currentPage.lat},${currentPage.lng}`, '_blank');
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingStream;

        const MIC_ICON = `<svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8h-2a5 5 0 01-10 0H3a7.001 7.001 0 006 6.93V17H6v2h8v-2h-3v-2z" clip-rule="evenodd"></path></svg>`;

        function setRecordButton(state) {
            const btn = document.getElementById('record-btn');
            btn.classList.toggle('recording-pulse', state === 'grabando');
            if(state === 'grabando') {
                btn.innerHTML = `<span class="w-3 h-3 bg-white rounded-full animate-ping mr-3"></span> <span id="record-text">${escapeHtml(t('stopRecording'))}</span>`;
            } else if(state === 'procesando') {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">${escapeHtml(t('processing'))}</span>`;
            } else {
                btn.innerHTML = `${MIC_ICON} <span id="record-text">${escapeHtml(t('recordVoice'))}</span>`;
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');

            if(isRecording) {
                // Parar grabación
                mediaRecorder.stop();
                if(recordingStream) {
                    recordingStream.getTracks().forEach(track => track.stop());
                }
                isRecording = false;
                setRecordButton('procesando');

            } else {
                // Iniciar grabación
                try {
                    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const rec = new MediaRecorder(recordingStream);
                    mediaRecorder = rec;
                    audioChunks = [];

                    // Página y diario a los que pertenece esta grabación. El volcado a
                    // data URL es asíncrono: para cuando termina, el usuario puede haber
                    // pasado de página o cerrado el diario, y el audio debe guardarse
                    // donde se grabó, no donde se esté en ese momento.
                    const targetPage = currentPage;
                    const targetJournal = currentJournal;

                    rec.ondataavailable = e => {
                        if(e.data.size > 0) audioChunks.push(e.data);
                    };

                    rec.onstop = () => {
                        // Safari/iOS graba en audio/mp4, no en webm. Con el tipo fijo a
                        // "audio/webm" el data URL quedaba mal etiquetado y el iPhone no
                        // podía reproducir la nota de voz.
                        const audioBlob = new Blob(audioChunks, { type: rec.mimeType || 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            if(!targetPage) return;
                            targetPage.audio = dataUrl;

                            setRecordButton('listo');
                            if(currentPage === targetPage) {
                                document.getElementById('page-audio').src = dataUrl;
                                document.getElementById('audio-container').classList.remove('hidden');
                                btn.classList.add('hidden'); // Ocultar botón
                            }

                            if(currentJournal === targetJournal) {
                                saveCurrentState();
                            } else if(targetJournal) {
                                // El diario ya está cerrado: guardarlo directamente
                                saveJournalDB(targetJournal).catch(err => console.error('Fallo al guardar el audio', err));
                            }
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    rec.start();
                    isRecording = true;
                    setRecordButton('grabando');

                } catch(err) {
                    console.error(err);
                    Modal.showMsg(t('micErrorTitle'), t('micErrorMsg'));
                }
            }
        }

        function removeAudio() {
            Modal.showMsg(t('deleteAudioTitle'), t('deleteAudioMsg'), true, () => {
                currentPage.audio = null;
                document.getElementById('page-audio').src = '';
                document.getElementById('audio-container').classList.add('hidden');
                document.getElementById('record-btn').classList.remove('hidden');
                saveCurrentState();
            });
        }
    </script>
</body>
</html>
